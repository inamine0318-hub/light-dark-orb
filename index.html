// ===== UPDATE =====
function update(){
    gTick++;
    if(gs==='splash'){splashTimer++;if(splashTimer>=180)gs='start';return;}
    if(gs==='story'){
        storyT++;
        if(storyT>STORY_PAGE_LEN){storyT=0;storyPage++;if(storyPage>=STORY.length)skipStory();}
        return;
    }
    if(gs==='stageclear'){clearTimer++;return;}
    if(gs==='ending'){clearTimer++;if(clearTimer>260)location.reload();return;}
    if(gs==='pdeath'){
        P.deathT++;P.vy+=GR*.6;P.y+=P.vy;P.x+=P.vx;P.vx*=.98;
        shake*=.85;if(shake<.4)shake=0;flash=Math.max(0,flash-1);
        parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life++;});
        parts=parts.filter(p=>p.life<p.maxLife);
        if(P.deathT>50)gs='gameover';
        return;
    }
    if(gs!=='playing')return;
    if(hitStop>0){hitStop--;return;}
    t++;
    // コンボタイマー（2秒でリセット）
    if(comboTimer>0){comboTimer--;if(comboTimer===0){combo=0;}};

    // Player move
    const cst=CHARS[selectedChar];
    const spd=cst.spd;
    if(keys.L){P.vx=-spd;P.dir=-1;}
    else if(keys.R){P.vx=spd;P.dir=1;}
    else P.vx*=.65;

    P.vy+=GR*cst.gr;P.vy=Math.min(P.vy,9);
    P.x+=P.vx;P.y+=P.vy;

    // Ground
    if(P.y+P.h>=GY){P.y=GY-P.h;P.vy=0;P.onG=true;P.dj=false;}
    else P.onG=false;

    // Platform collision
    if(!P.onG){
        platforms.forEach(pl=>{
            const px_=pl.sx-scroll;
            if(P.x+P.w>px_&&P.x<px_+pl.w){
                if(P.vy>0&&P.y+P.h<=pl.y+P.vy+4&&P.y+P.h>=pl.y-4){
                    P.y=pl.y-P.h;P.vy=0;P.onG=true;P.dj=false;
                }
            }
        });
    }

    // Squash landing detection
    if(!P.prevOnG&&P.onG){
        P.landSq=8;
        spark(P.x+P.w/2-scroll,GY-1,'#d8c8a0',5);
        if(P.jumpBufT>0){P.jumpBufT=0;doJump();}
    }
    if(P.landSq>0)P.landSq--;
    if(P.jumpSq>0)P.jumpSq--;
    P.prevOnG=P.onG;
    // コヨーテタイム：足場を離れても数フレームはジャンプ猶予
    if(P.onG)P.coyote=6;else if(P.coyote>0)P.coyote--;
    if(P.jumpBufT>0)P.jumpBufT--;
    // 歩行フットダスト（スマホ実機QA対応：接地感を明確にするため頻度・量を強化）
    if(P.onG&&Math.abs(P.vx)>0.4&&gTick%5===0)spark(P.x+P.w/2-scroll,GY-1,'#c8b898',4);

    // Bounds
    if(P.x<scroll)P.x=scroll;
    // ボス戦エリアロック：カメラ固定中はプレイヤーも画面内に閉じ込める
    if(bossActive&&!bossDefeated&&P.x>scroll+W-P.w-4)P.x=scroll+W-P.w-4;

    // Camera follow（ボス戦中はスクロールを固定し見失いを防止）
    if(!(bossActive&&!bossDefeated)){
        const target=P.x-W*.35+P.w/2;
        if(target>scroll)scroll=target;
    }

    P.fr++;P.inv=Math.max(0,P.inv-1);P.atkCd=Math.max(0,P.atkCd-1);P.comboWin=Math.max(0,P.comboWin-1);P.comboSkillWin=Math.max(0,P.comboSkillWin-1);
    P.vampT=Math.max(0,P.vampT-1);P.overT=Math.max(0,P.overT-1);P.magnetT=Math.max(0,P.magnetT-1);
    if(P.atk>0)P.atk--;

    // Attack hit
    if(P.atk>6){
        const aw=[18,22,32][P.atkCombo]||21;
        const dmgMul=([1,1,2][P.atkCombo]||1)*(P.overT>0?1.5:1);
        const ax=P.dir>0?P.x+P.w:P.x-aw;
        enemies.forEach(en=>{
            if(en.dead||en.inv>0)return;
            const ex=en.sx;
            if(ax<ex+en.w&&ax+aw>ex&&P.y<en.sy+en.h&&P.y+P.h>en.sy){
                en.hp-=dmgMul;en.inv=20;hitStop=2+P.atkCombo;en.knockX=P.dir*[4,6,8][P.atkCombo];
                combo++;comboTimer=150;if(combo>comboMax)comboMax=combo;
                if(P.vampT>0&&P.hp<P.mhp&&Math.random()<.35){P.hp=Math.min(P.mhp,P.hp+1);spark(P.x+P.w/2-scroll,P.y+P.h/2,'#ff4466',4);}
                spark(ex+en.w/2,en.sy+en.h/2,'#ffaa44',10);spark(ex+en.w/2,en.sy+en.h/2,'#ffffff',5);
                snd(260,.08,.6);
                if(en.hp<=0){en.dead=true;sfx('kill');const pts5=100*(1+Math.floor(combo/3));score+=pts5;spark(ex+5,en.sy+4,'#ff8820',18);spark(ex+5,en.sy+4,'#ffff44',8);
                    popup(en.sx-scroll+en.w/2,en.sy-6,'+'+pts5,combo>=5?'#ff4420':combo>=3?'#ff8820':'#ffee44');
                    if(Math.random()<.5)items.push({sx:en.sx,y:en.sy,w:8,h:8,type:'coin',life:300});}
            }
        });
    }

    // Enemy collision
    if(P.inv<=0){
        enemies.forEach(en=>{
            if(en.dead)return;
            const ex=en.sx;
            if(P.x<ex+en.w&&P.x+P.w>ex&&P.y<en.sy+en.h&&P.y+P.h>en.sy){
                P.hp--;P.inv=55;shake=6;flash=14;sfx('hit');P.vy=-3;
                if(P.hp<=0){killPlayer();}
            }
        });
    }

    // Items
    items.forEach(it=>{
        it.life--;
        if(P.magnetT>0&&it.type!=='capsule'){
            const mdx=(P.x+P.w/2)-it.sx,mdy=(P.y+P.h/2)-it.y;
            const md=Math.sqrt(mdx*mdx+mdy*mdy);
            if(md<70&&md>1){const pull=Math.min(6,140/md);it.sx+=mdx/md*pull;it.y+=mdy/md*pull;}
        }
        const ix=it.sx;
        if(P.x<ix+it.w&&P.x+P.w>ix&&P.y<it.y+it.h&&P.y+P.h>it.y){
            it.life=0;
            if(it.type==='heart'){P.hp=Math.min(P.mhp,P.hp+1);spark(ix+4-scroll,it.y,'#ff4466',10);snd(660,.15);popup(ix+4-scroll,it.y-8,'HEAL!','#ff4466');}
            else if(it.type==='coin'){score+=50;spark(ix+4-scroll,it.y,'#ffe840',8);sfx('coin');popup(ix+4-scroll,it.y-8,'+50','#ffe840');}
            else if(it.type==='orbfrag'){score+=500;spark(ix+5-scroll,it.y,'#ffe840',20);spark(ix+5-scroll,it.y,'#8822ff',16);snd(880,.5);popup(ix+5-scroll,it.y-10,'+500!','#ff88ff');}
            else if(it.type==='pwrup'){gainSkillExp();spark(ix+5-scroll,it.y,'#ffe840',14);spark(ix+5-scroll,it.y,'#ff8800',10);snd(660,.22);}
            else if(it.type==='capsule'){
                const dur=600;
                if(it.kind==='vamp'){P.vampT=dur;spark(ix+5-scroll,it.y,'#ff2255',16);spark(ix+5-scroll,it.y,'#ff88aa',10);snd(180,.3);snd(260,.2);popup(ix+5-scroll,it.y-10,'吸血!','#ff4466');}
                else if(it.kind==='over'){P.overT=dur;spark(ix+5-scroll,it.y,'#ffcc00',16);spark(ix+5-scroll,it.y,'#ffffff',10);snd(880,.15);snd(1100,.15);popup(ix+5-scroll,it.y-10,'過負荷!','#ffcc00');}
                else{P.magnetT=dur;spark(ix+5-scroll,it.y,'#33ccff',16);spark(ix+5-scroll,it.y,'#aaffff',10);snd(440,.1);snd(660,.15);popup(ix+5-scroll,it.y-10,'磁力!','#33ccff');}
            }
        }
    });
    items=items.filter(it=>it.life>0&&it.sx>scroll-40);

    // 地形ハザード（トゲ床・酸の沼）接触ダメージ：踏むと弾かれる
    if(P.inv<=0&&P.onG){
        hazards.forEach(hz=>{
            const hx=hz.sx;
            if(P.x+P.w>hx&&P.x<hx+hz.w){
                P.hp--;P.inv=55;shake=6;flash=14;sfx('hit');P.vy=-3.5;
                spark(P.x+P.w/2-scroll,GY-4,hz.type==='acid'?'#66cc22':'#cc4422',8);
                if(P.hp<=0)killPlayer();
            }
        });
    }

    // Update enemies
    enemies.forEach(en=>{
        if(en.dead){en.fr++;return;}
        en.fr++;en.inv=Math.max(0,en.inv-1);
        // ノックバック（既存のboss.knockXと同じ減衰方式を通常敵にも適用）
        if(en.knockX&&en.inv>10){en.sx+=en.knockX*(en.inv/20);}if(en.inv<=0)en.knockX=0;
        const pdx=(P.x+scroll)-(en.sx+en.w/2);

        if(en.type==='grub'){
            en.sx+=en.vx;
            if(en.sy+en.h<GY){en.vy+=GR;en.sy+=en.vy;}else{en.sy=GY-en.h;en.vy=0;}
            if(Math.abs(pdx)>4){en.vx=(pdx>0?.55:-.55);en.dir=pdx>0?1:-1;}else en.vx=0;
        }else if(en.type==='droid'){
            const dist=Math.abs(pdx);
            en.dir=pdx>0?1:-1;
            if(dist>80){en.sx+=(pdx>0?.4:-.4);}
            else if(dist<50){en.sx+=(pdx>0?-.3:.3);}
            if(en.sy+en.h<GY){en.vy+=GR;en.sy+=en.vy;}else{en.sy=GY-en.h;en.vy=0;}
            en.shotCd=Math.max(0,(en.shotCd||80)-1);
            if(en.shotCd<=0&&dist<170){
                en.shotCd=85;
                arrows.push({sx:en.sx+(en.dir>0?en.w:0),sy:en.sy+8,vx:en.dir*3.6,life:0,maxLife:85});
                snd(320,.06,.4);
            }
        }else if(en.type==='hunter'){
            // 高速・ジャンプ型
            const dist=Math.abs(pdx);
            en.dir=pdx>0?1:-1;
            en.sx+=en.dir*.85;
            if(en.sy+en.h<GY){en.vy+=GR*1.1;en.sy+=en.vy;}else{en.sy=GY-en.h;en.vy=0;}
            en.jumpCd=Math.max(0,(en.jumpCd||80)-1);
            if(en.jumpCd<=0&&dist<120&&en.sy+en.h>=GY){en.jumpCd=90;en.vy=-7;}
        }else if(en.type==='ufo'){
            // 空中浮遊・爆弾投下
            const targetY=(en.floatBase||GY-72)+Math.sin(en.fr*.04)*8;
            en.sy+=(targetY-en.sy)*.06;
            const dist=Math.abs(pdx);
            en.dir=pdx>0?1:-1;
            if(dist>40){en.sx+=en.dir*.5;}
            en.shotCd=Math.max(0,(en.shotCd||90)-1);
            if(en.shotCd<=0&&dist<200){
                en.shotCd=110+Math.floor(Math.random()*40);
                bombs.push({sx:en.sx+en.w/2-3,sy:en.sy+en.h,vy:0,life:0,maxLife:140});
                snd(180,.06,.3);
            }
        }else if(en.type==='sniper'){
            // バイオ・スナイパー：足場に居座り動かず直線弾を狙撃
            en.dir=pdx>0?1:-1;
            en.shotCd=Math.max(0,(en.shotCd||70)-1);
            if(en.shotCd<=0&&Math.abs(pdx)<220){
                en.shotCd=95+Math.floor(Math.random()*35);
                arrows.push({sx:en.sx+(en.dir>0?en.w:0),sy:en.sy+9,vx:en.dir*4.4,life:0,maxLife:100});
                snd(340,.07,.45);
            }
        }else if(en.type==='idrone'){
            // 侵略ドローン：上空を浮遊し斜め下へ弾丸を落とす
            const targetY2=(en.floatBase||GY-90)+Math.sin(en.fr*.05)*6;
            en.sy+=(targetY2-en.sy)*.05;
            en.dir=pdx>0?1:-1;
            en.sx+=en.dir*.7;
            en.shotCd=Math.max(0,(en.shotCd||100)-1);
            if(en.shotCd<=0&&Math.abs(pdx)<180){
                en.shotCd=130+Math.floor(Math.random()*40);
                bombs.push({sx:en.sx+en.w/2-3,sy:en.sy+en.h,vx:en.dir*1.8,vy:1,life:0,maxLife:120});
                snd(200,.06,.35);
            }
        }
    });
    enemies=enemies.filter(en=>(!en.dead||en.fr<25)&&en.sx>scroll-100&&en.sx<scroll+W+100);

    // Arrows
    arrows.forEach(ar=>{ar.sx+=ar.vx;ar.life++;});
    if(P.inv<=0){
        arrows.forEach(ar=>{
            const ax=ar.sx;
            if(P.x<ax+4&&P.x+P.w>ax&&P.y<ar.sy+3&&P.y+P.h>ar.sy){
                ar.life=999;
                P.hp--;P.inv=50;shake=5;flash=12;sfx('hit');P.vy=-2;
                if(P.hp<=0){killPlayer();}
            }
        });
    }
    arrows=arrows.filter(ar=>ar.life<ar.maxLife&&ar.sx>scroll-20&&ar.sx<scroll+W+20);

    // UFO爆弾 update
    bombs.forEach(bm=>{
        bm.vy+=0.38;bm.sy+=bm.vy;if(bm.vx)bm.sx+=bm.vx;bm.life++;
        // プレイヤー当たり
        if(P.inv<=0&&P.x<bm.sx+8&&P.x+P.w>bm.sx&&P.y<bm.sy+8&&P.y+P.h>bm.sy){
            bm.life=999;P.hp--;P.inv=50;shake=7;flash=14;sfx('hit');P.vy=-2;
            spark(bm.sx+4,bm.sy,'#ff8820',12);
            if(P.hp<=0){killPlayer();}
        }
        // 着地爆発
        if(bm.sy>GY-4&&bm.life<999){
            bm.life=999;spark(bm.sx+4,GY-4,'#ff6600',14);spark(bm.sx+4,GY-4,'#ffaa44',8);snd(200,.1,.5);
        }
    });
    bombs=bombs.filter(bm=>bm.life<bm.maxLife&&bm.sx>scroll-20&&bm.sx<scroll+W+20);

    // Boss
    if(scroll>=BOSS_TRIGGER&&!bossActive&&!bossDefeated){
        bossActive=true;
        if(stage===1){
            boss={sx:scroll+W-50,sy:GY-36,w:27,h:36,hp:20,maxHp:20,vx:0,vy:0,dir:-1,fr:0,inv:0,phase:'charge',cd:80,rage:false,dashDir:1,knockX:0,type:'tentacle'};
        }else{
            // ステージ2：機械系ドローン司令塔（見た目・攻撃パターンをタコ型ボスと真逆に）
            boss={sx:scroll+W-50,sy:GY-70,w:30,h:30,hp:24,maxHp:24,vx:0,vy:0,dir:-1,fr:0,inv:0,phase:'hover',cd:100,rage:false,knockX:0,type:'mech',floatBase:GY-70,laserT:0,spawnCd:220};
        }
    }
    if(boss&&!bossDefeated){
        boss.fr++;boss.inv=Math.max(0,boss.inv-1);
        const bdx=(P.x+scroll)-(boss.sx+boss.w/2);
        boss.dir=bdx>0?1:-1;
        boss.cd=Math.max(0,boss.cd-1);
        if(boss.knockX&&boss.inv>12){boss.sx+=boss.knockX*(boss.inv/16);}if(boss.inv<=0)boss.knockX=0;boss.rage=boss.hp<=Math.floor(boss.maxHp*0.5);
        const bspd=boss.rage?1.1:.7;
        if(boss.type==='tentacle'){
            if(boss.phase==='charge'){
                boss.sx+=(bdx>0?bspd:-bspd);
                if(boss.sy+boss.h<GY){boss.vy+=GR;boss.sy+=boss.vy;}else{boss.sy=GY-boss.h;boss.vy=0;}
                if(boss.cd<=0){
                    if(boss.rage&&Math.random()<.4){boss.phase='dash';boss.dashDir=boss.dir;boss.cd=30;}
                    else{boss.phase='stomp';boss.cd=38;boss.vy=-7;}
                }
            }else if(boss.phase==='stomp'){
                if(boss.sy+boss.h<GY){boss.vy+=GR;boss.sy+=boss.vy;}else{boss.sy=GY-boss.h;boss.vy=0;shake=4;boss.phase='charge';boss.cd=boss.rage?70:100;}
            }else if(boss.phase==='dash'){
                boss.sx+=boss.dashDir*(boss.rage?9:6);
                if(boss.cd<=0){boss.phase='charge';boss.cd=boss.rage?75:100;shake=2;}
            }
        }else{
            // ステージ2：機械系ドローン司令塔（ホバー移動→レーザー照射／ドローン増援、タコ型ボスとは真逆の空中砲台型）
            boss.sy=boss.floatBase+Math.sin(boss.fr*.05)*6;
            if(boss.phase==='hover'){
                boss.sx+=(bdx>0?1:-1)*(boss.rage?.9:.6);
                boss.spawnCd=Math.max(0,(boss.spawnCd||0)-1);
                if(boss.spawnCd<=0&&enemies.filter(e=>!e.dead).length<6){
                    boss.spawnCd=boss.rage?140:220;
                    enemies.push({sx:boss.sx+(boss.dir>0?boss.w:-14),sy:GY-30,w:18,h:30,hp:3,maxHp:3,vx:0,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'droid',shotCd:80});
                }
                if(boss.cd<=0){boss.phase='telegraph';boss.cd=40;boss.laserT=0;}
            }else if(boss.phase==='telegraph'){
                boss.laserT=(boss.laserT||0)+1;
                if(boss.cd<=0){boss.phase='laser';boss.cd=boss.rage?26:20;shake=3;snd(150,.3,.5);}
            }else if(boss.phase==='laser'){
                if(P.inv<=0&&P.y<boss.sy+boss.h+2&&P.y+P.h>boss.sy-2){
                    P.hp--;P.inv=60;shake=6;flash=14;sfx('hit');
                    if(P.hp<=0){killPlayer();}
                }
                if(boss.cd<=0){boss.phase='hover';boss.cd=boss.rage?70:100;}
            }
        }
        // ボス戦エリアロック：ボス自身も画面外へ出て見失われないよう閉じ込める
        if(boss.sx<scroll+8)boss.sx=scroll+8;
        if(boss.sx>scroll+W-boss.w-8)boss.sx=scroll+W-boss.w-8;
        // Attack hitbox（本体接触ダメージ・共通）
        if(P.inv<=0){
            const bx=boss.sx;
            if(P.x<bx+boss.w&&P.x+P.w>bx&&P.y<boss.sy+boss.h&&P.y+P.h>boss.sy){
                P.hp--;P.inv=60;shake=8;flash=18;sfx('hit');P.vy=-4;
                if(P.hp<=0){killPlayer();}
            }
        }
        // Player attack on boss
        if(P.atk>6){
            const aw=[18,22,32][P.atkCombo]||PW;
            const dmgMul=([1,1,2][P.atkCombo]||1)*(P.overT>0?1.5:1);
            const ax=P.dir>0?P.x+P.w:P.x-aw;
            const bx=boss.sx;
            if(boss.inv<=0&&ax<bx+boss.w&&ax+aw>bx&&P.y<boss.sy+boss.h&&P.y+P.h>boss.sy){
                boss.hp-=dmgMul;boss.inv=16;boss.knockX=P.dir*5;spark(bx+11,boss.sy+10,'#ffaa44',10);snd(200,.08,.7);
                if(P.vampT>0&&P.hp<P.mhp&&Math.random()<.35){P.hp=Math.min(P.mhp,P.hp+1);spark(P.x+P.w/2-scroll,P.y+P.h/2,'#ff4466',4);}
                if(boss.hp<=0){
                    bossDefeated=true;boss=null;
                    score+=1000;spark(scroll+W/2,GY-40,'#ffe840',30);spark(scroll+W/2,GY-40,'#8822ff',30);
                    sfx('kill');snd(880,.5);stopBgm();
                    items.push({sx:scroll+W/2,y:GY-20,w:10,h:10,type:'orbfrag',life:600});
                    gs='stageclear';clearTimer=0;
                }
            }
        }
    }

    // Platforms
    platSpawnCd--;
    if(platSpawnCd<=0&&!bossActive){
        platSpawnCd=140+Math.floor(Math.random()*80);
        const pw=18+Math.floor(Math.random()*22);
        const ph=GY-22-Math.floor(Math.random()*38);
        const stone=Math.random()<.5;
        platforms.push({sx:scroll+W+8,y:ph,w:pw,h:6,stone});
        if(Math.random()<.3)items.push({sx:scroll+W+8+pw/2-4,y:ph-10,w:8,h:8,type:Math.random()<.5?'coin':'heart',life:500});
        // バイオ・スナイパー：高所の足場に居座り直線弾を撃つ遠距離敵
        else if(t>150&&Math.random()<.3)enemies.push({sx:scroll+W+8+pw/2-9,sy:ph-20,w:18,h:20,hp:2,maxHp:2,vx:0,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'sniper',shotCd:70});
    }
    platforms=platforms.filter(pl=>pl.sx>scroll-60&&pl.sx<scroll+W+200);

    // 地形ハザード（トゲ床・酸の沼）：平地の単調さ解消、ジャンプ/足場の価値を上げる
    if(!bossActive){
        hazSpawnCd--;
        if(hazSpawnCd<=0){
            hazSpawnCd=170+Math.floor(Math.random()*90);
            const hw=14+Math.floor(Math.random()*10);
            hazards.push({sx:scroll+W+16,w:hw,h:8,type:Math.random()<.5?'spike':'acid'});
        }
    }
    hazards=hazards.filter(hz=>hz.sx>scroll-60&&hz.sx<scroll+W+200);

    // Spawn（ステージ進行で種類増加）
    if(!bossActive){
        spawnCd--;
        if(spawnCd<=0){
            const diff=Math.max(0.5,1-scroll/6000);
            spawnCd=Math.floor((80+Math.floor(Math.random()*60))*diff);
            // Stage1: Grub→+Droid  Stage2: +Hunter→+UFO
            const roll=Math.random();
            if(stage===1){
                if(t>350&&roll<.4){
                    // ドロイド（遠距離）
                    enemies.push({sx:scroll+W+10,sy:GY-30,w:18,h:30,hp:3,maxHp:3,vx:0,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'droid',shotCd:60});
                }else{
                    // グラブ（近接）
                    enemies.push({sx:scroll+W+10,sy:GY-24,w:18,h:24,hp:2,maxHp:2,vx:-.5,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'grub'});
                }
            }else{// Stage 2
                if(roll<.3){
                    // ハンター（高速跳躍型）
                    enemies.push({sx:scroll+W+10,sy:GY-26,w:16,h:26,hp:4,maxHp:4,vx:-.8,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'hunter',jumpCd:80});
                }else if(roll<.6){
                    // ドロイド
                    enemies.push({sx:scroll+W+10,sy:GY-30,w:18,h:30,hp:4,maxHp:4,vx:0,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'droid',shotCd:50});
                }else{
                    // グラブ（HPup）
                    enemies.push({sx:scroll+W+10,sy:GY-24,w:18,h:24,hp:3,maxHp:3,vx:-.6,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'grub'});
                }
            }
            if(t>180&&Math.random()<(P.hp<=2?.6:.3))
                items.push({sx:scroll+W+50,y:GY-8,w:8,h:8,type:'heart',life:400});
        }
        // UFOスポーン（Stage1後半 or Stage2）
        if(!bossActive&&(stage===2||(stage===1&&scroll>1200))){
            const ufoOnScreen=enemies.some(e=>e.type==='ufo'&&!e.dead);
            if(!ufoOnScreen&&Math.random()<.004){
                enemies.push({sx:scroll+W+20,sy:GY-72,w:30,h:16,hp:5,maxHp:5,vx:-.4,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'ufo',shotCd:90,floatBase:GY-72});
            }
        }
        // 侵略ドローンスポーン（ステージ序盤から出現し空の脅威を早期に提示）
        if(!bossActive&&scroll>300){
            const droneOnScreen=enemies.some(e=>e.type==='idrone'&&!e.dead);
            if(!droneOnScreen&&Math.random()<.005){
                enemies.push({sx:scroll+W+20,sy:GY-90,w:20,h:16,hp:3,maxHp:3,vx:-.5,vy:0,dir:-1,fr:0,inv:0,dead:false,type:'idrone',shotCd:100,floatBase:GY-90});
            }
        }
    }

    // パワーアップアイテムスポーン
    if(!bossActive){
        pwrupSpawnCd--;
        if(pwrupSpawnCd<=0){
            pwrupSpawnCd=200+Math.floor(Math.random()*140);
            const py=GY-10-Math.floor(Math.random()*55);
            items.push({sx:scroll+W+20,y:py,w:12,h:12,type:'pwrup',life:700});
        }
    }

    // 消費カプセル（吸血/過負荷/磁力）スポーン：強力な時限バフをランダムで1種ドロップ
    if(!bossActive){
        capsuleSpawnCd--;
        if(capsuleSpawnCd<=0){
            capsuleSpawnCd=500+Math.floor(Math.random()*260);
            const py2=GY-10-Math.floor(Math.random()*55);
            const kinds=['vamp','over','magnet'];
            items.push({sx:scroll+W+20,y:py2,w:12,h:12,type:'capsule',kind:kinds[Math.floor(Math.random()*3)],life:700});
        }
    }

    // 飛び道具update
    orbs.forEach(ob=>{
        ob.sx+=ob.vx;
        if(ob.vy!==0){ob.sy+=ob.vy;}
        if(ob.type==='flame'){ob.vy+=0.25;} // 重力
        if(ob.type==='bounce'){
            ob.vy+=0.3;
            if(ob.sy>=GY-6){ob.sy=GY-6;ob.vy=-Math.abs(ob.vy)*.75;snd(300,.04,.3);}
        }
        ob.life++;
        const osz=ob.lv?12:(ob.size||6);
        enemies.forEach(en=>{
            if(en.dead||en.inv>0)return;
            const ex=en.sx,ox=ob.sx;
            if(ox<ex+en.w&&ox+osz>ex&&ob.sy<en.sy+en.h&&ob.sy+osz>en.sy){
                if(ob.type==='poison'){
                    // 毒煙幕：消滅させず、通常より少し長いinvで継続ダメージ量を抑えた設置型ゾーン
                    en.hp-=(ob.dmg||1);en.inv=24;hitStop=1;
                    spark(ex+en.w/2,en.sy+en.h/2,'#66cc22',4);
                }else{
                    // アーキタイプ別のhitStop/ノックバック（リサーチ次長のバランス表に基づく）
                    const _hb={dark:{hs:5,kb:6},fire:{hs:5,kb:6},arrow:{hs:3,kb:3},flame:{hs:6,kb:9},shock:{hs:6,kb:10},bounce:{hs:4,kb:5}}[ob.type]||{hs:3,kb:4};
                    en.hp-=(ob.dmg||1);en.inv=20;if(!ob.lv)ob.life=999;hitStop=Math.min(8,_hb.hs);en.knockX=(ob.vx>0?1:-1)*_hb.kb;
                    combo++;comboTimer=120;if(combo>comboMax)comboMax=combo;
                    spark(ex+en.w/2,en.sy+en.h/2,'#8822ff',10);spark(ex+en.w/2,en.sy+en.h/2,'#ffffff',4);snd(180,.08,.6);
                    if(ob.type==='bounce'&&ob.split&&!ob._didSplit){
                        ob._didSplit=true;
                        for(let i=0;i<2;i++){
                            const a=i===0?-.6:.6;
                            orbs.push({sx:ob.sx,sy:ob.sy,vx:Math.cos(a)*4*(ob.vx>=0?1:-1),vy:Math.sin(a)*4-1.5,life:0,maxLife:60,type:'bounce',dmg:1,size:4});
                        }
                    }
                }
                if(en.hp<=0){en.dead=true;sfx('kill');const pts6=100*(1+Math.floor(combo/3));score+=pts6;spark(ex+5,en.sy+4,'#6600cc',18);spark(ex+5,en.sy+4,'#ff88ff',8);popup(en.sx-scroll+en.w/2,en.sy-6,'+'+pts6,combo>=5?'#ff44ff':'#cc88ff');if(P.hp<=2&&Math.random()<.15)items.push({sx:en.sx,y:en.sy,w:8,h:8,type:'heart',life:400});}
            }
        });
        if(boss&&!bossDefeated&&boss.inv<=0){
            const bx=boss.sx,ox=ob.sx;
            if(ox<bx+boss.w&&ox+osz>bx&&ob.sy<boss.sy+boss.h&&ob.sy+osz>boss.sy){
                if(ob.type==='poison'){
                    boss.hp-=(ob.dmg||1);boss.inv=20;
                    spark(bx+11,boss.sy+10,'#66cc22',4);
                }else{
                    boss.hp-=(ob.dmg||1);boss.inv=16;boss.knockX=(ob.vx>0?1:-1)*4;if(!ob.lv)ob.life=999;
                    spark(bx+11,boss.sy+10,'#8822ff',10);snd(180,.08,.7);
                }
                if(boss.hp<=0){
                    bossDefeated=true;boss=null;score+=1000;
                    spark(scroll+W/2,GY-40,'#ffe840',30);spark(scroll+W/2,GY-40,'#8822ff',30);
                    sfx('kill');snd(880,.5);stopBgm();
                    popup(W/2,GY-50,'+1000!!','#ffe840');
                    items.push({sx:scroll+W/2,y:GY-20,w:10,h:10,type:'orbfrag',life:600});
                    gs='stageclear';clearTimer=0;
                }
            }
        }
    });
    orbs=orbs.filter(ob=>ob.life<ob.maxLife&&ob.sx>scroll-20&&ob.sx<scroll+W+20);

    // Particles
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life++;});
    parts=parts.filter(p=>p.life<p.maxLife);

    if(skillCd>0)skillCd--;
    shake*=.85;if(shake<.4)shake=0;flash=Math.max(0,flash-1);
    if(stageFlash>0)stageFlash--;
    popups.forEach(pp=>{pp.y+=pp.vy;pp.life++;});
    popups=popups.filter(pp=>pp.life<pp.maxLife);
    if(t%90===0)score+=stage*5;
}

// ===== DRAW =====
function draw(){
    utx.clearRect(0,0,uic.width,uic.height);
    const sx=Math.round((Math.random()-.5)*shake),sy=Math.round((Math.random()-.5)*shake);
    ctx.save();ctx.scale(SC,SC);ctx.translate(sx,sy);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

    // Stage Clear
    if(gs==='stageclear'){
        // 背景グラデーション
        const scBg=ctx.createLinearGradient(0,0,0,H);
        scBg.addColorStop(0,'#04021a');scBg.addColorStop(1,'#0a0620');
        ctx.fillStyle=scBg;ctx.fillRect(0,0,W,H);
        // 輝くパーティクル（多色・流れる）
        for(let i=0;i<70;i++){
            const pa=(.12+Math.sin(gTick*.04+i)*.11)*Math.min(1,clearTimer/22);
            const pc=i%3===0?[255,232,64]:i%3===1?[200,100,255]:[255,255,255];
            ctx.fillStyle=`rgba(${pc[0]},${pc[1]},${pc[2]},${pa})`;
            ctx.fillRect(((i*73+clearTimer*.45)|0)%W,((i*47+clearTimer*.18)|0)%H,i%6===0?2:1,i%6===0?2:1);
        }
        const cp=Math.min(1,clearTimer/30);
        // オーブ（階層グロー付き）
        const orbR2=10+Math.sin(clearTimer*.09)*2.5;
        ctx.globalAlpha=cp*.18;
        ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2-22,H/2-12,orbR2*2.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2+22,H/2-12,orbR2*2.2,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=cp*.55;
        ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2-22,H/2-12,orbR2*1.35,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2+22,H/2-12,orbR2*1.35,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=cp;
        ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2-22,H/2-12,orbR2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2+22,H/2-12,orbR2,0,Math.PI*2);ctx.fill();
        // 白い輝き（中心点）
        ctx.globalAlpha=cp*.75;
        ctx.fillStyle='#fffce0';ctx.beginPath();ctx.arc(W/2-23,H/2-13,3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#e8b0ff';ctx.beginPath();ctx.arc(W/2+23,H/2-13,3,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        txo('STAGE '+stage+' CLEAR!',W/2,H/2-26,'#ffe840',11,undefined,cp);
        txo('SCORE '+score,W/2,H/2+2,'#ffff44',8,undefined,cp);
        if(clearTimer>60&&Math.floor(clearTimer/25)%2===0)
            txo(stage<2?'タップで次のステージへ':'全ステージ制覇！',W/2,H/2+22,'#44ff88',7);
        ctx.restore();return;
    }

    // エンディング画面
    if(gs==='ending'){
        ctx.save();ctx.scale(SC,SC);
        ctx.fillStyle='#000012';ctx.fillRect(0,0,W,H);
        for(let i=0;i<70;i++){
            const sa=Math.sin(clearTimer*.015+i*.8)*.5+.5;
            ctx.fillStyle=`rgba(255,255,255,${sa*.55})`;
            ctx.fillRect(((i*97+clearTimer*.5)%W+W)%W,((i*61+clearTimer*.3)%H+H)%H,1,1);
        }
        for(let i=0;i<10;i++){
            const oa=i*Math.PI/5+clearTimer*.018;
            const ox=W/2+Math.cos(oa)*68;const oy=H/2+Math.sin(oa)*38;
            const oc=i%2===0?'#ffe840':'#8822ff';
            ctx.globalAlpha=0.6+Math.sin(clearTimer*.12+i)*.4;
            ctx.fillStyle=oc;ctx.beginPath();ctx.arc(ox,oy,4+Math.sin(clearTimer*.1+i)*1.5,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=0.15;ctx.beginPath();ctx.arc(ox,oy,10,0,Math.PI*2);ctx.fill();
        }
        ctx.globalAlpha=1;
        const fIn=Math.min(1,clearTimer/40);
        txo('GAME CLEAR!',W/2,H/2-28,'#ffe840',13,undefined,fIn);
        txo('全ステージ制覇！',W/2,H/2-8,'#ffff66',7.5,undefined,fIn);
        txo('SCORE  '+score,W/2,H/2+10,'#44ffaa',8,undefined,fIn);
        if(best===score&&clearTimer>20)txo('NEW RECORD!',W/2,H/2+26,'#ff8820',7,undefined,fIn);
        if(clearTimer>60&&Math.floor(clearTimer/28)%2===0)txo('ありがとう！',W/2,H/2+40,'#ffffff',6.5);
        ctx.restore();return;
    }
    // Splash（ロゴはuicの高解像度キャンバスに描画→pixelated不使用）
    if(gs==='splash'){
        ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
        const fade=splashTimer<30?splashTimer/30:splashTimer>130?Math.max(0,1-(splashTimer-130)/30):1;
        if(logoImg.complete&&logoImg.naturalWidth>0){
            ctx.save();
            ctx.globalAlpha=fade;
            ctx.imageSmoothingEnabled=true;
            const lw=W*0.62;
            const lh=lw*(logoImg.naturalHeight/logoImg.naturalWidth);
            ctx.drawImage(logoImg,(W-lw)/2,(H-lh)/2,lw,lh);
            ctx.imageSmoothingEnabled=false;
            ctx.restore();
        }else{
            ctx.save();
            ctx.globalAlpha=fade;
            ctx.fillStyle='#ffffff';
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.font='bold 18px sans-serif';
            ctx.fillText('内無双GAMES',W/2,H/2-10);
            ctx.font='11px sans-serif';
            ctx.fillStyle='#aaaacc';
            ctx.fillText('PRESENTS',W/2,H/2+12);
            ctx.restore();
        }
        ctx.restore();return;
    }
    // オープニングストーリー（ページ送りフェードイン）
    if(gs==='story'){
        ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
        for(let i=0;i<40;i++){
            const stb=.1+Math.sin(gTick*.02+i)*.08;
            const stx=(i*53+7)%W,sty=(i*31+11)%H;
            ctx.fillStyle=`rgba(255,255,255,${stb})`;ctx.fillRect(stx,sty,1,1);
        }
        let _storyAlpha=1;
        if(storyT<STORY_FADE)_storyAlpha=storyT/STORY_FADE;
        else if(storyT>STORY_FADE+STORY_HOLD)_storyAlpha=Math.max(0,1-(storyT-STORY_FADE-STORY_HOLD)/STORY_FADE);
        const lines=STORY[storyPage]||[];
        const ly0=H/2-(lines.length-1)*7;
        lines.forEach((ln,i)=>txo(ln,W/2,ly0+i*14,'#ffffff',6.5,undefined,_storyAlpha));
        // SKIPボタン（常時表示・いつでもメインゲームへ）
        txo('SKIP ▶',W-6,H-6,'#88ccff',5.5,'right',.7+Math.sin(gTick*.1)*.15);
        ctx.restore();return;
    }

    if(stage===1)drawBg();else drawBg2();

    // Platforms
    drawPlatforms();

    // Items
    items.forEach(it=>{const ix=it.sx-scroll;if(ix<-10||ix>W+10)return;drawItem(it);});
    hazards.forEach(hz=>{const hx=hz.sx-scroll;if(hx<-20||hx>W+20)return;drawHazard(hz);});

    // Arrows (ドロイドのエネルギービーム)
    arrows.forEach(ar=>{
        const ax=Math.floor(ar.sx-scroll),ay=Math.floor(ar.sy);
        const adir=ar.vx>0?1:-1;
        // グロー外輪
        ctx.globalAlpha=.2;ctx.fillStyle='#00ddff';ctx.fillRect(ax-2,ay-2,14,8);
        ctx.globalAlpha=1;
        // ビーム本体
        ctx.fillStyle='#0055bb';ctx.fillRect(ax,ay+1,11,2);
        ctx.fillStyle='#22aaff';ctx.fillRect(ax+1,ay+1,9,2);
        ctx.fillStyle='#88ddff';ctx.fillRect(ax+2,ay+2,5,1);
        // 先端（光る矢先）
        const tip=adir>0?ax+10:ax+1;
        ctx.fillStyle='#ffffff';ctx.fillRect(tip,ay,2,4);
        ctx.globalAlpha=.7;ctx.fillStyle='#aaeeff';ctx.fillRect(tip+(adir>0?2:-2),ay+1,3,2);
        ctx.globalAlpha=1;
    });
    // UFO爆弾
    bombs.forEach(bm=>{
        const bx=Math.floor(bm.sx-scroll),by=Math.floor(bm.sy);
        ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(bx+4,by+4,5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(bx+3,by+3,3,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=.35;ctx.fillStyle='#ff2200';ctx.beginPath();ctx.arc(bx+4,by+4,8,0,Math.PI*2);ctx.fill();
        // 火花尾
        ctx.globalAlpha=.6;ctx.fillStyle='#ffcc44';px(bx+2,by+8,4,4+Math.floor(bm.vy*.5));
        ctx.globalAlpha=1;
    });

    // Enemies
    enemies.forEach(en=>{
        if(en.dead&&en.fr>20)return;
        const ex=en.sx-scroll;if(ex<-20||ex>W+20)return;
        if(en.type==='grub')drawGrub(en);
        else if(en.type==='droid')drawDroid(en);
        else if(en.type==='hunter')drawHunter(en);
        else if(en.type==='ufo')drawUFO(en);
        else if(en.type==='sniper')drawSniper(en);
        else if(en.type==='idrone')drawIDrone(en);
        if(en.inv>0&&!en.dead&&Math.floor(en.inv/4)%2!==0){
            ctx.globalAlpha=0.48;ctx.fillStyle='#ff2222';
            ctx.fillRect(ex-1,en.sy-1,en.w+2,en.h+2);
            ctx.globalAlpha=1;
        }
    });

    // Boss
    if(boss&&!bossDefeated){
        const bx=boss.sx-scroll;if(bx>-30&&bx<W+30){if(boss.type==='mech')drawBossMech(boss);else drawBoss(boss);}
    }

    // 飛び道具描画
    orbs.forEach(ob=>{
        const ox=Math.floor(ob.sx-scroll),oy=Math.floor(ob.sy);
        ctx.globalAlpha=1;
        if(ob.type==='dark'){
            const r=ob.size||4;
            ctx.globalAlpha=.85+Math.sin(gTick*.15)*.15;
            ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(ox+r,oy+r,r,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=.3;ctx.fillStyle='#cc88ff';ctx.beginPath();ctx.arc(ox+r,oy+r,r*1.7,0,Math.PI*2);ctx.fill();
            if(r>=8){ctx.globalAlpha=.15;ctx.fillStyle='#ff00ff';ctx.beginPath();ctx.arc(ox+r,oy+r,r*2.2,0,Math.PI*2);ctx.fill();}
        }else if(ob.type==='fire'||ob.type==='flame'){
            const r=ob.size||(ob.type==='flame'?3:4);
            const f=.7+Math.sin(gTick*.2)*.3;
            ctx.globalAlpha=f*(ob.type==='flame'?.8:1);
            ctx.fillStyle='#ff8820';ctx.beginPath();ctx.arc(ox+r,oy+r,r,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#ffee44';ctx.beginPath();ctx.arc(ox+r,oy+r,r*.5,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=.2;ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(ox+r,oy+r,r*1.6,0,Math.PI*2);ctx.fill();
        }else if(ob.type==='arrow'){
            const th=ob.size||3;
            ctx.fillStyle=ob.lv?'#88ffaa':'#44cc44';px(ox,oy+1,10,th);
            ctx.fillStyle=ob.lv?'#eeffcc':'#ccee88';px(ob.vx>0?ox+8:ox,oy,3,th+1);
            ctx.fillStyle='#886622';px(ob.vx>0?ox:ox+7,oy+1,3,th);
            if(ob.lv){ctx.globalAlpha=.4;ctx.fillStyle='#aaffcc';px(ox,oy+1,10,th);ctx.globalAlpha=1;}
        }else if(ob.type==='shock'){
            const base=ob.size||18;
            const sw=base+ob.life*.7;
            ctx.globalAlpha=Math.max(0,.85-ob.life/(ob.maxLife||70)*.7);
            ctx.fillStyle='#ffee44';ctx.fillRect(ox-sw/2,oy,sw,5);
            ctx.globalAlpha*=.4;ctx.fillStyle='#ffffff';ctx.fillRect(ox-sw/2-3,oy-2,sw+6,9);
        }else if(ob.type==='bounce'){
            const r=ob.size||5;
            ctx.fillStyle='#44aaff';ctx.beginPath();ctx.arc(ox+r,oy+r,r,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=.5;ctx.fillStyle='#88ddff';ctx.beginPath();ctx.arc(ox+r,oy+r,r*.65,0,Math.PI*2);ctx.fill();
        }else if(ob.type==='poison'){
            // 毒煙幕：もくもくと漂う緑のガス（寿命が近づくと薄くなる）
            const r=ob.size||14,fade=Math.max(0,1-ob.life/(ob.maxLife||150));
            for(let i=0;i<3;i++){
                const pa=gTick*.05+i*2.1,pr=r*.5+Math.sin(gTick*.07+i)*3;
                ctx.globalAlpha=.28*fade;ctx.fillStyle='#66cc22';
                ctx.beginPath();ctx.arc(ox+r/2+Math.cos(pa)*3,oy+Math.sin(pa)*2,pr,0,Math.PI*2);ctx.fill();
            }
            ctx.globalAlpha=.15*fade;ctx.fillStyle='#aaff66';ctx.beginPath();ctx.arc(ox+r/2,oy,r,0,Math.PI*2);ctx.fill();
        }else if(ob.type==='skill'){
            const lv=ob.lv||1;
            const r=4+lv*2;
            const t2=gTick*.18;
            if(lv===1){
                ctx.globalAlpha=.9+Math.sin(t2)*.1;
                ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(ox+5,oy+5,r,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ox+4,oy+4,r-2,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=.28;ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(ox+5,oy+5,r+5,0,Math.PI*2);ctx.fill();
            }else if(lv===2){
                ctx.globalAlpha=.92;
                ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(ox+5,oy+5,r,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(ox+5,oy+5,r-2,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=.38;ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(ox+5,oy+5,r+6,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=.7;ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;
                ctx.beginPath();ctx.arc(ox+5,oy+5,r-1,t2,t2+Math.PI*1.4);ctx.stroke();
            }else{
                const hue=gTick*7%360;
                ctx.globalAlpha=1;
                ctx.fillStyle=`hsl(${hue},100%,65%)`;ctx.beginPath();ctx.arc(ox+5,oy+5,r,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ox+5,oy+5,r-3,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=.42;ctx.fillStyle=`hsl(${hue+120},100%,70%)`;ctx.beginPath();ctx.arc(ox+5,oy+5,r+7,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=.2;ctx.fillStyle=`hsl(${hue+240},100%,70%)`;ctx.beginPath();ctx.arc(ox+5,oy+5,r+12,0,Math.PI*2);ctx.fill();
            }
        }
        ctx.globalAlpha=1;
    });

    // Player
    const drawFns=[drawHero,drawDemonLord,drawMage,drawElf,drawDragon,drawGoblin,drawGolem,drawSlime];
    if(gs==='pdeath'){
        const dt=P.deathT||0,cxp=P.x-scroll+P.w/2,cyp=P.y+P.h/2;
        ctx.save();
        ctx.globalAlpha=Math.max(0,1-dt/50);
        ctx.translate(cxp,cyp);ctx.rotate(dt*.16*-P.dir);ctx.translate(-cxp,-cyp);
        drawWithOutline(drawFns[selectedChar],P.x-scroll,P.y-25,false,CHAR_SCALE,CHAR_SCALE);
        ctx.restore();
    }else{
        var _sqX=1,_sqY=1;
        // オーバーアクション化：スクワッシュ&ストレッチ・揺れ幅を従来の約2倍に拡大
        if(P.jumpSq>0){_sqY=0.60;_sqX=1.34;}
        else if(!P.onG){if(P.vy<-2){var _s=Math.min(0.4,Math.abs(P.vy)*0.07);_sqY=1+_s;_sqX=1-_s*0.5;}else if(P.vy>2){var _s2=Math.min(0.26,P.vy*0.05);_sqY=1+_s2;_sqX=1-_s2*0.4;}}
        else if(P.landSq>0){var _t=P.landSq/8;_sqY=1-_t*0.4;_sqX=1+_t*0.32;}
        var _ib=0;
        if(P.onG&&Math.abs(P.vx)<0.5)_ib=(Math.sin(gTick*0.06)*4|0); // 待機：呼吸のような上下揺れ
        else if(P.onG)_ib=(Math.abs(Math.sin(gTick*0.5))*5|0); // 歩行：足運びの重心上下動（スマホ実機QAで劇的強化指示）
        drawWithOutline(drawFns[selectedChar],P.x-scroll,P.y+_ib-25,false,_sqX*CHAR_SCALE,_sqY*CHAR_SCALE);
    }

    // 3段コンボ斬撃エフェクト（勇者・ゴブリン）
    if(gs==='playing'&&P.atk>0&&(selectedChar===0||selectedChar===5)){
        const bxp=P.x-scroll;
        const co=P.atkCombo;
        const maxA=[12,16,22][co]||14;
        const prog=Math.min(1,P.atk/maxA);
        const r=[22,29,42][co]||24; // オーバーアクション化：斬撃エフェクトを約1.6倍に拡大
        const lw=[4,5.5,8.5][co]||4.5;
        const col=['#ffffff','#ffff88','#ffe840'][co]||'#ffffff';
        const ax=bxp+(P.dir>0?P.w+6:-6);
        const ay=P.y+P.h*[.6,.35,.5][co];
        const a0=P.dir>0?-1.1:Math.PI+1.1,a1=P.dir>0?1.1:Math.PI-1.1;
        ctx.globalAlpha=prog*.88;ctx.strokeStyle=col;ctx.lineWidth=lw;
        ctx.beginPath();ctx.arc(ax,ay,r,a0,a1);ctx.stroke();
        ctx.globalAlpha=prog*.28;ctx.strokeStyle='#ffffff';ctx.lineWidth=lw+5;
        ctx.beginPath();ctx.arc(ax,ay,r,a0,a1);ctx.stroke();
        if(co===2){ctx.globalAlpha=prog*.18;ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(ax,ay,r+8,0,Math.PI*2);ctx.fill();}
        ctx.globalAlpha=1;
    }

    // Particles
    parts.forEach(p=>{
        ctx.globalAlpha=Math.max(0,1-p.life/p.maxLife)*.9;
        ctx.fillStyle=p.col;ctx.fillRect(Math.floor(p.x),Math.floor(p.y),2,2);
    });
    ctx.globalAlpha=1;

    // フローティングポップアップ
    popups.forEach(pp=>{
        if(pp.x<-20||pp.x>W+20)return;
        const pal=Math.max(0,1-pp.life/pp.maxLife);
        const psc=1+Math.sin(pp.life*0.25)*0.06;
        utx.save();
        const ux=pp.x*SC*uRatio,uy=pp.y*SC*uRatio,usz=7*SC*uRatio*psc;
        utx.font=`bold ${usz}px -apple-system,'Hiragino Sans','Noto Sans JP',Arial,sans-serif`;
        utx.textAlign='center';
        utx.globalAlpha=pal;
        utx.fillStyle='rgba(0,0,0,.7)';
        for(const[ox,oy]of[[-1,0],[1,0],[0,-1],[0,1]])utx.fillText(pp.txt,ux+ox*1.5,uy+oy*1.5);
        utx.fillStyle=pp.col;utx.fillText(pp.txt,ux,uy);
        utx.globalAlpha=1;utx.restore();
    });
    // Buttons
    if(gs==='playing'){
        const skillReady=skillLv>0&&skillCd<=0;
        const bDefs=[
            {b:BTN.L,lbl:'◀',col:'#5577ee',sub:'',on:keys.L},{b:BTN.R,lbl:'▶',col:'#5577ee',sub:'',on:keys.R},
            {b:BTN.J,lbl:'跳',col:'#33cc33',sub:'JUMP',on:tids.J!==null},{b:BTN.A,lbl:'攻',col:'#ee3333',sub:'ATK',on:P.atk>0},
            {b:BTN.S,lbl:'技',col:'#ffcc00',sub:'SKL',on:skillReady}
        ];
        bDefs.forEach(({b,lbl,col,sub,on})=>{
            const bc=(b===BTN.S&&skillReady)?'#ffe840':col;
            ctx.globalAlpha=on?.7:.3;ctx.fillStyle=bc;
            ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=on?1:.6;ctx.strokeStyle=bc;ctx.lineWidth=on?2:1.5;
            ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
            ctx.globalAlpha=1;txo(lbl,b.x,b.y+1.5,'#ffffff',9);
            if(sub)txo(sub,b.x,b.y+b.r+5,on?'#ffffff':'#778899',3.5);
        });
        // スキルボタン：LV表示・コンボ〆ウィンドウ
        {
            const skillNames=['旋風','闇波','隕石','矢雨','炎龍','爆走','地震','分裂'];
            const lvStr=skillLv>0?'Lv'+skillLv:'';
            txo(skillNames[selectedChar]+lvStr,BTN.S.x,BTN.S.y-BTN.S.r-3,'#ffe840',3.5);if(skillLv<3){var _se='';for(var _i=0;_i<3;_i++)_se+=(_i<skillExp?'*':'o');txo(_se,BTN.S.x,BTN.S.y-BTN.S.r-9,'#ffaa44',3);}
            if(P.comboSkillWin>0){// コンボ〆可能→ボタン白フラッシュ
                const pulse=Math.sin(gTick*.5)*.5+.5;
                ctx.globalAlpha=.55+pulse*.4;ctx.fillStyle='#ffffff';
                ctx.beginPath();ctx.arc(BTN.S.x,BTN.S.y,BTN.S.r+4,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=1;
                txo('NOW!',BTN.S.x,BTN.S.y+BTN.S.r+5,'#ffe840',4.5);
            }else if(skillCd>0){
                const maxCd=P.comboSkillWin>0?150:300;
            const prog=Math.max(0,(maxCd-skillCd)/maxCd);
                ctx.globalAlpha=.8;ctx.strokeStyle='#44ff88';ctx.lineWidth=2.5;
                ctx.beginPath();ctx.arc(BTN.S.x,BTN.S.y,BTN.S.r,-Math.PI/2,-Math.PI/2+prog*Math.PI*2);ctx.stroke();
                txo(Math.ceil(skillCd/60)+'s',BTN.S.x,BTN.S.y+BTN.S.r+5,'#44ff88',3.5);
                ctx.globalAlpha=1;
            }else{
                txo('READY',BTN.S.x,BTN.S.y+BTN.S.r+5,'#ffe840',3.5);
            }
        }
    }

    // HUD
    if(gs==='playing'){
        const hudGrd=ctx.createLinearGradient(0,0,0,14);
        hudGrd.addColorStop(0,'rgba(0,0,28,.92)');hudGrd.addColorStop(1,'rgba(0,0,10,.48)');
        ctx.fillStyle=hudGrd;ctx.fillRect(0,0,W,14);
        ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,0,W,1);
        ctx.fillStyle='rgba(0,0,0,.30)';ctx.fillRect(0,13,W,1);
        txo('HP',9,9,'#88aaff',5,'left');
        for(let i=0;i<P.mhp;i++)txo(i<P.hp?'♥':'♡',22+i*10,9,i<P.hp?'#ff4466':'#442233',6);
        txo('SCORE '+score,W-4,9,'#ffee44',6,'right');
        txo('ST.'+stage,W/2,9,'#88ccff',4.5);
        // 消費カプセルの効果時間バフ表示（ボス戦中は非表示にしHPバーと衝突させない）
        if(!bossActive){
            let _buffY=19;
            if(P.vampT>0){txo('吸血 '+Math.ceil(P.vampT/60)+'s',4,_buffY,'#ff6688',3.2,'left');_buffY+=5;}
            if(P.overT>0){txo('過負荷 '+Math.ceil(P.overT/60)+'s',4,_buffY,'#ffcc44',3.2,'left');_buffY+=5;}
            if(P.magnetT>0){txo('磁力 '+Math.ceil(P.magnetT/60)+'s',4,_buffY,'#44ccff',3.2,'left');_buffY+=5;}
        }
        // コンボ表示
        if(combo>=2){
            const ct=comboTimer/120;
            ctx.globalAlpha=Math.min(1,ct*3);
            const csc=1+Math.sin(gTick*.2)*.05;
            ctx.save();ctx.translate(W/2,26);ctx.scale(csc,csc);
            txo(combo+'HIT',0,-4,combo>=10?'#ff4420':combo>=5?'#ff8820':'#ffe840',combo>=10?10:8);
            txo('COMBO',0,6,'#ffffff',5);
            ctx.restore();ctx.globalAlpha=1;
        }
        // Boss approach warning
        const dist=BOSS_TRIGGER-scroll;
        if(dist>0&&dist<600&&!bossActive){
            const wa=Math.min(1,Math.sin(gTick*.15+1)*.5+.5);
            txo('！ボスが近い！',W/2,H/2-20,'#ff4444',7,undefined,wa);
        }
        if(bossDefeated&&Math.floor(gTick/30)%2===0)
            txo('ボス討伐！ステージクリア！',W/2,H/2-20,'#ffe840',7);
        // ボスHPバー（大型HUD）
        if(bossActive&&boss&&!bossDefeated){
            const bw=Math.floor(W*0.62);const bx2=Math.floor((W-bw)/2);
            ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(bx2-2,14,bw+4,11);
            ctx.fillStyle='#220000';ctx.fillRect(bx2,15,bw,9);
            const hpFrac=boss.hp/boss.maxHp;
            const bCol=hpFrac>0.5?'#cc2222':hpFrac>0.25?'#ff8800':'#ff2222';
            ctx.fillStyle=bCol;ctx.fillRect(bx2,15,Math.floor(bw*hpFrac),9);
            if(boss.rage){ctx.globalAlpha=0.3+Math.sin(gTick*.5)*.3;ctx.fillStyle='#ff4400';ctx.fillRect(bx2,15,Math.floor(bw*hpFrac),9);ctx.globalAlpha=1;}
            ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(bx2,15,Math.floor(bw*hpFrac),3);
            if(boss.rage){var _rp=.7+Math.sin(gTick*.4)*.3;ctx.globalAlpha=_rp;txo('RAGE!',W/2-Math.floor(W*.31)-8,21,'#ff4400',4.5);ctx.globalAlpha=1;}txo(boss.type==='mech'?'SENTINEL':'WARLORD',W/2,21,boss.type==='mech'?'#88ccff':'#ff88aa',4);
        }
    }

    // Flash
    if(flash>0){ctx.globalAlpha=(flash/14)*.4;ctx.fillStyle='#ff0000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    // ステージ暗転フラッシュ
    if(stageFlash>0){
        const sfp=stageFlash>30?(stageFlash-30)/30:stageFlash/30;
        ctx.globalAlpha=sfp;ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
        if(stageFlash>20&&stageFlash<45)txo('STAGE '+stage,W/2,H/2,'#ffe840',14,undefined,Math.min(1,(stageFlash-20)/12));
    }
    ctx.restore();

    // Start screen
    if(gs==='start'){
        ctx.save();ctx.scale(SC,SC);
        ctx.fillStyle='rgba(0,0,5,.9)';ctx.fillRect(0,0,W,H);
        // Stars（多色・流れる・80個）
        for(let i=0;i<80;i++){
            const stb=.12+Math.sin(gTick*.03+i)*.11;
            const stx=((i*73+11)+Math.floor(gTick*(i%4===0?.22:i%4===1?.12:.07)))%W;
            const sty=((i*47+7)+Math.floor(gTick*(i%3===0?.09:.06)))%90;
            const stc=i%3===0?[255,232,64]:i%3===1?[200,110,255]:[255,255,255];
            ctx.fillStyle=`rgba(${stc[0]},${stc[1]},${stc[2]},${stb})`;
            ctx.fillRect(stx,sty,i%7===0?2:1,i%7===0?2:1);
        }
        // タイトル背景パネル（グラデーション）
        const tbg=ctx.createLinearGradient(0,0,0,42);
        tbg.addColorStop(0,'rgba(0,0,35,.72)');tbg.addColorStop(1,'rgba(0,0,10,0)');
        ctx.fillStyle=tbg;ctx.fillRect(0,0,W,42);
        // タイトル（上部コンパクト）
        const pulse=Math.sin(gTick*.06)*.15;
        // オーブ大グロー
        ctx.globalAlpha=.09+pulse*.1;
        ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2-38,18,24,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2+38,18,24,0,Math.PI*2);ctx.fill();
        // オーブ中グロー
        ctx.globalAlpha=.25+pulse*.18;
        ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2-38,18,13,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2+38,18,13,0,Math.PI*2);ctx.fill();
        // オーブ本体
        ctx.globalAlpha=Math.min(1,.88+pulse);
        ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2-38,18,6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2+38,18,6,0,Math.PI*2);ctx.fill();
        // オーブ白ハイライト
        ctx.globalAlpha=1;
        ctx.fillStyle='#fffce0';ctx.beginPath();ctx.arc(W/2-40,16,2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#e8b0ff';ctx.beginPath();ctx.arc(W/2+40,16,2,0,Math.PI*2);ctx.fill();
        // オーブ周回粒子（LIGHT=時計回り DARK=逆回転）
        for(let i=0;i<10;i++){const ang=gTick*.06+i*(Math.PI*2/10);const pr=10+Math.sin(gTick*.1+i)*2;ctx.globalAlpha=Math.max(0,.2+Math.sin(gTick*.12+i*1.5)*.15);ctx.fillStyle='#ffe840';ctx.fillRect(Math.floor(W/2-38+Math.cos(ang)*pr),Math.floor(18+Math.sin(ang)*pr*.4),1,1);}
        for(let i=0;i<10;i++){const ang=-gTick*.06+i*(Math.PI*2/10);const pr=10+Math.sin(gTick*.1+i)*2;ctx.globalAlpha=Math.max(0,.2+Math.sin(gTick*.12+i*1.5)*.15);ctx.fillStyle='#cc44ff';ctx.fillRect(Math.floor(W/2+38+Math.cos(ang)*pr),Math.floor(18+Math.sin(ang)*pr*.4),1,1);}
        ctx.globalAlpha=1;
        // LIGHT/DARK 逆位相パルス（交互に強調）
        const pL=.65+Math.sin(gTick*.07)*.35;const pD=.65+Math.sin(gTick*.07+Math.PI)*.35;
        txo('LIGHT',W/2-38,22,'#ffe840',5.5,'center',pL);
        txo('&',W/2,22,'#ffffff',5);
        txo('DARK',W/2+38,22,'#cc88ff',5.5,'center',pD);
        txo('ORB',W/2,34,'#ffffff',10);
        // ORB 後ろグロー（2層 - DARK/LIGHT重ね）
        ctx.globalAlpha=.05+Math.sin(gTick*.04)*.03;ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(W/2,32,26,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=.08+Math.sin(gTick*.04+.8)*.05;ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W/2,32,20,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=.15+pulse*.09;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(W/2,32,14,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        // タイトル下区切り線（グラデーション）
        const slg=ctx.createLinearGradient(0,0,W,0);
        slg.addColorStop(0,'rgba(255,232,64,0)');slg.addColorStop(.25,'rgba(255,232,64,.7)');
        slg.addColorStop(.5,'rgba(255,255,255,.95)');slg.addColorStop(.75,'rgba(204,136,255,.7)');
        slg.addColorStop(1,'rgba(204,136,255,0)');
        ctx.fillStyle=slg;ctx.fillRect(0,39,W,1);
        // 2列グリッドキャラ選択
        drawGrid();
        if(best>0)txo('BEST '+best,W-4,8,'#ffaa44',4.5,'right');
        ctx.restore();
    }

    // Gameover screen
    if(gs==='gameover'){
        ctx.save();ctx.scale(SC,SC);
        ctx.fillStyle='rgba(0,0,0,.90)';ctx.fillRect(0,0,W,H);
        // 赤ビネット
        const vig=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,W*.72);
        vig.addColorStop(0,'rgba(55,0,0,0)');vig.addColorStop(1,'rgba(70,0,0,.58)');
        ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
        // 破砕円（パルス）
        ctx.strokeStyle='#991a1a';ctx.lineWidth=1.5;
        ctx.globalAlpha=.5+Math.sin(gTick*.05)*.22;
        ctx.beginPath();ctx.arc(W/2,H/2-46,15,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=1;
        // X字（スタイリッシュ）
        ctx.strokeStyle='#ff3333';ctx.lineWidth=2.5;
        ctx.beginPath();ctx.moveTo(W/2-12,H/2-55);ctx.lineTo(W/2+12,H/2-37);ctx.stroke();
        ctx.beginPath();ctx.moveTo(W/2+12,H/2-55);ctx.lineTo(W/2-12,H/2-37);ctx.stroke();
        // 破片ライン
        ctx.strokeStyle='rgba(255,70,50,.42)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(W/2,H/2-58);ctx.lineTo(W/2+7,H/2-70);ctx.stroke();
        ctx.beginPath();ctx.moveTo(W/2-4,H/2-57);ctx.lineTo(W/2-12,H/2-68);ctx.stroke();
        ctx.beginPath();ctx.moveTo(W/2+4,H/2-57);ctx.lineTo(W/2+13,H/2-66);ctx.stroke();
        txo('GAME OVER',W/2,H/2-16,'#ff4444',11);
        txo('スコア: '+score,W/2,H/2+6,'#ffff44',8);
        txo('ベスト: '+best,W/2,H/2+22,'#ffaa44',7);
        if(comboMax>=2)txo('最大コンボ: '+comboMax+'HIT',W/2,H/2+35,'#ff8820',5.5);
        if(Math.floor(gTick/28)%2===0)txo('タップでリトライ',W/2,H/2+50,'#44ff44',7);
        ctx.restore();
    }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
