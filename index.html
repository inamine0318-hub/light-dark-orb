function resize(){
    const sw=innerWidth,sh=innerHeight;
    uRatio=devicePixelRatio||1;
    if(sh>sw){
        // 縦向き：90°回転してランドスケープ表示
        SC=sw/H;

        GY=H-30;
        cv.width=sh;cv.height=sw;

// ===== AUDIO =====
let _ac=null,_sfxGain=null;
function getAC(){
    try{
        if(!_ac||_ac.state==='closed'){_ac=new(AudioContext||webkitAudioContext)();_sfxGain=null;}
        if(_ac.state==='suspended')_ac.resume();
        if(!_sfxGain){_sfxGain=_ac.createGain();_sfxGain.gain.value=0.42;_sfxGain.connect(_ac.destination);}
        return _ac;
    }catch(e){return null;}
}
function getSfxDst(){return _sfxGain||(_ac&&_ac.destination)||null;}
function snd(f,d,v){
    const ac=getAC(),dst=getSfxDst();if(!ac||!dst)return;
    try{
        const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(dst);
        o.frequency.value=f;
        g.gain.setValueAtTime(.1*(v!==undefined?v:1),now);
        g.gain.exponentialRampToValueAtTime(.001,now+d);
        o.start(now);o.stop(now+d);
    }catch(e){}
}
function mkNoise(ac,dur){
    try{const sr=ac.sampleRate,len=Math.ceil(sr*dur),buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return buf;}catch(e){return null;}
}
function sfx(type){
    const ac=getAC(),dst=getSfxDst();if(!ac||!dst)return;
    try{
        const now=ac.currentTime;
        if(type==='swing'){
            const o=ac.createOscillator();o.type='sawtooth';
            const g=ac.createGain();o.connect(g);g.connect(dst);
            o.frequency.setValueAtTime(420,now);o.frequency.exponentialRampToValueAtTime(130,now+.1);
            g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+.12);
            o.start(now);o.stop(now+.12);
        }else if(type==='jump'){
            const o=ac.createOscillator();o.type='square';
            const g=ac.createGain();o.connect(g);g.connect(dst);
            o.frequency.setValueAtTime(200,now);o.frequency.exponentialRampToValueAtTime(420,now+.1);
            g.gain.setValueAtTime(.055,now);g.gain.exponentialRampToValueAtTime(.001,now+.13);
            o.start(now);o.stop(now+.13);
        }else if(type==='hit'){
            const nb=mkNoise(ac,.15);if(!nb)return;
            const src=ac.createBufferSource();src.buffer=nb;
            const flt=ac.createBiquadFilter();flt.type='lowpass';flt.frequency.value=600;
            const g=ac.createGain();g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.001,now+.15);
            src.connect(flt);flt.connect(g);g.connect(dst);src.start(now);src.stop(now+.18);
            const o=ac.createOscillator();o.type='sine';
            o.frequency.setValueAtTime(160,now);o.frequency.exponentialRampToValueAtTime(50,now+.13);
            const g2=ac.createGain();g2.gain.setValueAtTime(.25,now);g2.gain.exponentialRampToValueAtTime(.001,now+.14);
            o.connect(g2);g2.connect(dst);o.start(now);o.stop(now+.15);
        }else if(type==='kill'){
            [392,523,659].forEach((freq,i)=>{
                const o=ac.createOscillator();o.type='square';o.frequency.value=freq;
                const g=ac.createGain(),t0=now+i*.06;
                g.gain.setValueAtTime(0,t0);g.gain.setValueAtTime(.065,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+.1);
                o.connect(g);g.connect(dst);o.start(t0);o.stop(t0+.12);
            });
        }else if(type==='coin'){
            [659,784].forEach((freq,i)=>{
                const o=ac.createOscillator();o.type='sine';o.frequency.value=freq;
                const g=ac.createGain(),t0=now+i*.07;
                g.gain.setValueAtTime(0,t0);g.gain.setValueAtTime(.08,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+.1);
                o.connect(g);g.connect(dst);o.start(t0);o.stop(t0+.12);
            });
        }else if(type==='darkorb'){
            const o=ac.createOscillator();o.type='sawtooth';
            const g=ac.createGain();o.connect(g);g.connect(dst);
            o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(80,now+.15);
            g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);
            o.start(now);o.stop(now+.18);
        }
    }catch(e){}
}

// ===== BGM =====
let bgmAc=null,bgmGain=null,bgmSeq=null;
const N={
    // 音名→周波数マップ
    C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,
    C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,B5:988,
    _:0 // 休符
};
// Stage1: 明るいファンタジー冒険
const BGM1=[[N.E5,.15],[N._,.05],[N.G5,.15],[N.A5,.2],[N._,.1],[N.G5,.15],[N.E5,.15],[N.D5,.3],[N._,.2],
    [N.C5,.15],[N.E5,.15],[N.G5,.15],[N.E5,.3],[N._,.2],[N.D5,.15],[N.C5,.15],[N.D5,.4],[N._,.3],
    [N.A4,.15],[N.C5,.15],[N.E5,.15],[N.G5,.3],[N._,.15],[N.E5,.15],[N.D5,.15],[N.C5,.4],[N._,.3],
    [N.G4,.2],[N.A4,.2],[N.C5,.2],[N.E5,.4],[N.D5,.2],[N.C5,.2],[N.D5,.6],[N._,.4]];
// Stage2: 洞窟・ダンジョン（短調）
const BGM2=[[N.A4,.2],[N._,.1],[N.G4,.15],[N.A4,.2],[N._,.15],[N.F4,.15],[N.G4,.3],[N._,.2],
    [N.E4,.15],[N.F4,.15],[N.E4,.2],[N.D4,.2],[N._,.2],[N.E4,.15],[N.D4,.15],[N.C4,.4],[N._,.3],
    [N.A4,.15],[N._,.1],[N.A4,.15],[N.B4,.15],[N.A4,.2],[N._,.15],[N.G4,.2],[N.A4,.35],[N._,.3],
    [N.F4,.2],[N.E4,.2],[N.D4,.2],[N.E4,.4],[N.D4,.2],[N.C4,.2],[N.A4,.6],[N._,.4]];

// ===== SELECT SCREEN: ICON / GAUGE PRIMITIVES =====
function drawIcon(type,x,y,s,col){
    s=s||1;
    ctx.save();ctx.translate(Math.floor(x),Math.floor(y));ctx.scale(s,s);
    ctx.fillStyle=col;ctx.strokeStyle=col;
    switch(type){
        case 'sword':
            ctx.save();ctx.rotate(-Math.PI/4);
            ctx.fillStyle='#e8eef8';ctx.fillRect(-1,-6,2,8);
            ctx.fillStyle=col;ctx.fillRect(-3,2,6,1);ctx.fillRect(-1,3,2,3);
            ctx.restore();
            break;
        case 'slash':
            ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,5,-Math.PI*.7,-Math.PI*.1);ctx.stroke();
            ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,3,-Math.PI*.6,-Math.PI*.2);ctx.stroke();
            break;
        case 'orb':
            ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=1;ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(-1,-1,1,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
            break;
        case 'arrow':
            ctx.fillRect(-5,-1,7,2);
            ctx.beginPath();ctx.moveTo(4,-3);ctx.lineTo(7,0);ctx.lineTo(4,3);ctx.closePath();ctx.fill();
            ctx.fillRect(-6,-3,2,2);ctx.fillRect(-6,1,2,2);
            break;
        case 'flame':
            ctx.beginPath();ctx.moveTo(0,-6);ctx.quadraticCurveTo(4,-2,2,3);ctx.quadraticCurveTo(4,1,3,5);
            ctx.quadraticCurveTo(0,7,-3,5);ctx.quadraticCurveTo(-4,1,-2,3);ctx.quadraticCurveTo(-4,-2,0,-6);ctx.fill();
            break;
        case 'shock':
            ctx.lineWidth=1.5;
            ctx.beginPath();ctx.arc(0,3,3,Math.PI,0);ctx.stroke();
            ctx.beginPath();ctx.arc(0,3,6,Math.PI,0);ctx.stroke();
            break;
        case 'bounce':
            ctx.beginPath();ctx.arc(-3,3,3,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(3,-3,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
            break;
        case 'jump1':
            ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(4,1);ctx.lineTo(1,1);ctx.lineTo(1,6);ctx.lineTo(-1,6);ctx.lineTo(-1,1);ctx.lineTo(-4,1);ctx.closePath();ctx.fill();
            break;
        case 'jump2':
            ctx.globalAlpha=.45;
            ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(3,-2);ctx.lineTo(1,-2);ctx.lineTo(1,-1);ctx.lineTo(-1,-1);ctx.lineTo(-1,-2);ctx.lineTo(-3,-2);ctx.closePath();ctx.fill();
            ctx.globalAlpha=1;
            ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(4,5);ctx.lineTo(1,5);ctx.lineTo(1,7);ctx.lineTo(-1,7);ctx.lineTo(-1,5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();
            break;
        case 'float':
            ctx.globalAlpha=.9;
            ctx.beginPath();ctx.ellipse(0,-1,5,2,0,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=.6;
            ctx.beginPath();ctx.ellipse(0,3,3,1.2,0,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=1;
            break;
        case 'speed':
            ctx.fillRect(-6,-4,10,1.5);ctx.fillRect(-6,-.5,7,1.5);ctx.fillRect(-6,3,10,1.5);
            break;
        case 'heavy':
            ctx.fillRect(-4,-5,8,8);
            ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-4,-5,8,3);
            break;
        case 'star':{
            ctx.beginPath();
            for(let i=0;i<5;i++){
                const a=-Math.PI/2+i*Math.PI*2/5,a2=a+Math.PI/5;
                ctx.lineTo(Math.cos(a)*6,Math.sin(a)*6);
                ctx.lineTo(Math.cos(a2)*2.5,Math.sin(a2)*2.5);
            }
            ctx.closePath();ctx.fill();
            break;}
    }
    ctx.restore();
}
function drawBar(x,y,w,h,frac,col){
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x,y,w,h);
    ctx.fillStyle=col;ctx.fillRect(x,y,Math.max(0,Math.min(w,w*frac)),h);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}

function drawCharPreview(idx,cx,cy,scale){
    // [bx, by, scaleMultiplier] — キャラごとのサイズ・位置調整
    const PP=[
        [-7,-14,1.00], // 勇者: 金髪by-1〜足by+47
        [-7,-11,0.88], // 魔王: 角by-6〜ローブby+48
        [-7,-6, 0.85], // 魔法使い: 帽子by-8〜足by+47
        [-7,-14,1.00], // エルフ: とんがり帽子by-10〜足by+47
        [-7,-14,1.00], // ドラゴン: 角by-4〜足by+47
        [-7,-22,1.00], // ゴブリン: 兜by+9〜足by+47
        [-7,-14,0.90], // ゴーレム: 頭by+0〜拳by+46
        [-7,-14,1.00], // スライム: アンテナby+6〜足by+46
    ];
    const [pbx,pby,pm]=PP[idx]||[-7,-5,1];
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale*pm,scale*pm);
    // 実際のdraw関数を流用（P.invなどは一時的に退避）
    const si=P.inv,sa=P.atk,sc=P.atkCd,sd=P.dir,sf=P.fr,sg=P.onG,svx=P.vx;
    P.inv=0;P.atk=0;P.atkCd=0;P.dir=1;P.fr=8;P.onG=true;P.vx=0;
    const drawFnsP=[drawHero,drawDemonLord,drawMage,drawElf,drawDragon,drawGoblin,drawGolem,drawSlime];
    drawWithOutline(drawFnsP[idx],pbx,pby,true);
    P.inv=si;P.atk=sa;P.atkCd=sc;P.dir=sd;P.fr=sf;P.onG=sg;P.vx=svx;
    ctx.restore();
}

// フォーカスパネル用：決定時アピールモーション付きプレビュー（振りかぶり→攻撃→フォローを自動ループ）
function drawCharPreviewFocus(idx,cx,cy,scale){
    const PP=[
        [-7,-14,1.00],[-7,-11,0.88],[-7,-6,0.85],[-7,-14,1.00],
        [-7,-14,1.00],[-7,-22,1.00],[-7,-14,0.90],[-7,-14,1.00],
    ];
    const [pbx,pby,pm]=PP[idx]||[-7,-5,1];
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale*pm,scale*pm);
    const si=P.inv,sa=P.atk,sc=P.atkCd,sd=P.dir,sf=P.fr,sg=P.onG,svx=P.vx,sac=P.atkCombo;
    const CYC=150,ph=gTick%CYC;
    let atkV=0;
    if(ph>=50&&ph<100)atkV=22*(1-(ph-50)/50);
    P.inv=0;P.atk=atkV;P.atkCd=atkV>0?10:0;P.atkCombo=2;P.dir=1;P.fr=8;P.onG=true;P.vx=0;
    const drawFnsP=[drawHero,drawDemonLord,drawMage,drawElf,drawDragon,drawGoblin,drawGolem,drawSlime];
    drawWithOutline(drawFnsP[idx],pbx,pby,true);
    P.inv=si;P.atk=sa;P.atkCd=sc;P.dir=sd;P.fr=sf;P.onG=sg;P.vx=svx;P.atkCombo=sac;
    ctx.restore();
    return atkV>0;
}

// ===== キャラ選択画面：一覧リスト + フォーカス詳細パネル =====
const SEL_GTOP=42,SEL_GBOT=158,SEL_LISTX=3,SEL_LISTW=98,SEL_FX=105,SEL_FW=W-4-SEL_FX;
function drawSelList(){
    const rowH=(SEL_GBOT-SEL_GTOP)/CHARS.length;
    CHARS.forEach((ch,i)=>{
        const ry=SEL_GTOP+i*rowH,sel=i===selectedChar;
        ctx.globalAlpha=sel?0.30:0.05;
        ctx.fillStyle=sel?ch.col:'#ffffff';
        ctx.fillRect(SEL_LISTX,ry+.5,SEL_LISTW,rowH-1);
        ctx.globalAlpha=1;
        if(sel){ctx.fillStyle=ch.col;ctx.fillRect(SEL_LISTX,ry+1,2,rowH-2);}
        const cyMid=ry+rowH/2;
        drawCharPreview(i,SEL_LISTX+10,cyMid,sel?0.42:0.32);
        txo(ch.name,SEL_LISTX+19,cyMid-1,sel?ch.col:'#99a5b5',5,'left',sel?1:0.55);
        drawIcon(ch.atkIcon,SEL_LISTX+SEL_LISTW-13,cyMid,0.62,sel?ch.col:'#5a6575');
        drawIcon(ch.moveIcon,SEL_LISTX+SEL_LISTW-4,cyMid,0.62,sel?ch.col:'#5a6575');
    });
}
function drawSelFocus(){
    const ch=CHARS[selectedChar],fx=SEL_FX,fy=SEL_GTOP,fw=SEL_FW,fh=SEL_GBOT-SEL_GTOP;
    const pulse=.5+Math.sin(gTick*.07)*.5;
    // パネル背景・暗転オーバーレイ（フォーカス以外を落ち着かせる）
    ctx.fillStyle='rgba(0,0,12,.55)';ctx.fillRect(fx,fy,fw,fh);
    ctx.globalAlpha=.55+pulse*.35;ctx.strokeStyle=ch.col;ctx.lineWidth=1;ctx.strokeRect(fx+.5,fy+.5,fw-1,fh-1);ctx.globalAlpha=1;
    // プレビュー中心のグロー
    const pcx=fx+42,pcy=fy+62;
    ctx.globalAlpha=.10+pulse*.08;ctx.fillStyle=ch.col;ctx.beginPath();ctx.arc(pcx,pcy,30,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.18+pulse*.12;ctx.beginPath();ctx.arc(pcx,pcy,18,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    // 周回きらめき
    for(let p=0;p<6;p++){
        const pang=gTick*.07+p*(Math.PI*2/6),pr=24+Math.sin(gTick*.09+p)*3;
        ctx.globalAlpha=Math.max(0,.35+Math.sin(gTick*.1+p*1.4)*.25);
        ctx.fillStyle=ch.col;
        ctx.fillRect(Math.floor(pcx+Math.cos(pang)*pr),Math.floor(pcy+Math.sin(pang)*pr*.45),1,1);
    }
    ctx.globalAlpha=1;
    // 名前
    txo(ch.name,pcx,fy+9,ch.col,8,'center');
    // アピールモーション付き大型プレビュー
    drawCharPreviewFocus(selectedChar,pcx,pcy,1.05);
    // アイコン+タグ列（攻撃・移動・必殺）
    const ix=fx+84,iw=fw-84-6;
    const rows=[[ch.atkIcon,ch.atk],[ch.moveIcon,ch.moveLabel],['star',ch.skill]];
    rows.forEach((r,i)=>{
        const ry=fy+13+i*15;
        drawIcon(r[0],ix+7,ry,0.85,ch.col);
        txo(r[1],ix+16,ry+1,'#dfe6f0',4.3,'left');
    });
    // ステータスゲージ（HP / SPD / RNG）
    const gx=ix,gw=iw-2,gyBase=fy+62;
    const sp5=Math.max(.15,Math.min(1,(ch.spd-0.8)/2.0));
    const rng5=ch.rng/5;
    const hp5=ch.mhp/8;
    [['HP','#ff4466',hp5],['SPD','#44ff88',sp5],['RNG','#66ccff',rng5]].forEach((g,i)=>{
        const gy=gyBase+i*11;
        txo(g[0],gx,gy+3,'#8a95a8',3.4,'left');
        drawBar(gx+16,gy,gw-16,5,g[2],g[1]);
    });
    // 内無双ゲージ（覚醒ゲージ）スロット - 全キャラ共通・右下
    const ax=fx+fw-58,ay=fy+fh-20,aw=54,ah=14;
    const awPulse=.4+Math.sin(gTick*.12)*.25;
    ctx.strokeStyle=`rgba(255,220,120,${.5+awPulse*.3})`;ctx.lineWidth=1;ctx.strokeRect(ax+.5,ay+.5,aw-1,ah-1);
    ctx.fillStyle='rgba(255,220,120,.08)';ctx.fillRect(ax,ay,aw,ah);
    ctx.globalAlpha=.5+awPulse*.4;ctx.fillStyle='#ffe07a';
    for(let s=0;s<3;s++)ctx.fillRect(ax+3+s*7,ay+4,4,ah-8);
    ctx.globalAlpha=1;
    txo('内無双',ax+aw/2,ay-3,'#ffd070',3.6,'center');
    // 攻撃デモをループ再生中インジケータ
    txo('● DEMO LOOP',fx+8,fy+fh-4,'rgba(255,255,255,.4)',3.2,'left');
}
function drawGrid(){
    drawSelList();
    drawSelFocus();
    const _bs=Math.floor(gTick/22)%2===0;
    if(_bs)txo('▶ 再タップでSTART ◀',W/2,H-4,'#44ff88',5.5);
    else txo('タップでキャラ選択',W/2,H-4,'#338855',4.5);
}

function startBgm(st){
    stopBgm();
    try{
        bgmAc=new(AudioContext||webkitAudioContext)();
        bgmGain=bgmAc.createGain();bgmGain.gain.value=0.14;bgmGain.connect(bgmAc.destination);
        const seq=st===2?BGM2:BGM1;
        let idx=0,time=bgmAc.currentTime+.05;
        function sched(){
            while(time<bgmAc.currentTime+.6){
                const[f,d]=seq[idx%seq.length];
                if(f>0){
                    const o=bgmAc.createOscillator();o.type='square';o.frequency.value=f;
                    const g=bgmAc.createGain();
                    g.gain.setValueAtTime(0,time);g.gain.setValueAtTime(.4,time+.01);
                    g.gain.setValueAtTime(.4,time+d*.65);g.gain.exponentialRampToValueAtTime(.001,time+d*.9);
                    o.connect(g);g.connect(bgmGain);o.start(time);o.stop(time+d);
                }
                time+=d;idx++;
            }
            bgmSeq=setTimeout(sched,200);
        }
        sched();
    }catch(e){}
}
function stopBgm(){
    clearTimeout(bgmSeq);bgmSeq=null;
    try{if(bgmAc)bgmAc.close();}catch(e){}
    bgmAc=null;bgmGain=null;
}

function px(x,y,w,h){ctx.fillRect(Math.floor(x),Math.floor(y),w,h);}

// ===== PIXEL ART HELPERS (Nintendo style) =====
function pixelCircle(cx,cy,r,color,shade,hilight){
    const cx_=Math.floor(cx),cy_=Math.floor(cy);
    ctx.fillStyle=color;
    for(let dy=-r;dy<=r;dy++){
        const dx=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)));
        if(dx>0)ctx.fillRect(cx_-dx,cy_+dy,dx*2+1,1);
    }
    if(shade){
        ctx.fillStyle=shade;
        for(let dy=Math.floor(r*.3);dy<=r;dy++){
            const dx=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)));
            if(dx>2)ctx.fillRect(cx_+dx-3,cy_+dy,3,1);
        }
    }
    if(hilight){
        ctx.fillStyle=hilight;
        for(let dy=-r;dy<=Math.floor(-r*.3);dy++){
            const dx=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)));
            if(dx>0)ctx.fillRect(cx_-dx,cy_+dy,Math.floor(dx*.5)+1,1);
        }
    }
}

// Outline (Nintendo-style dark border around characters)
const _OFC_W=72,_OFC_H=72,_OFC_BX=18,_OFC_BY=13;
let _charOfc,_charOfcCtx,_outlineOfc,_outlineOfcCtx;
function _initOfc(){
    if(_charOfc)return;
    _charOfc=new OffscreenCanvas(_OFC_W,_OFC_H);
    _charOfcCtx=_charOfc.getContext('2d');
    _charOfcCtx.imageSmoothingEnabled=false;
    _outlineOfc=new OffscreenCanvas(_OFC_W,_OFC_H);
    _outlineOfcCtx=_outlineOfc.getContext('2d');
}
function drawWithOutline(fn,bx,by,forceVisible,sqX,sqY){
    _initOfc();
    _charOfcCtx.clearRect(0,0,_OFC_W,_OFC_H);
    const _prev=ctx; ctx=_charOfcCtx;
    if(forceVisible){const si=P.inv;P.inv=0;fn(_OFC_BX,_OFC_BY);P.inv=si;}
    else{fn(_OFC_BX,_OFC_BY);}
    ctx=_prev;
    const id=_charOfcCtx.getImageData(0,0,_OFC_W,_OFC_H);
    const src=id.data;
    const out=new Uint8ClampedArray(_OFC_W*_OFC_H*4);
    for(let y=1;y<_OFC_H-1;y++){
        for(let x=1;x<_OFC_W-1;x++){
            const i=(y*_OFC_W+x)*4;
            if(src[i+3]>30)continue;
            const u=((y-1)*_OFC_W+x)*4,d=((y+1)*_OFC_W+x)*4;
            const l=(y*_OFC_W+x-1)*4,r2=(y*_OFC_W+x+1)*4;
            if(src[u+3]>50||src[d+3]>50||src[l+3]>50||src[r2+3]>50){
                out[i]=4;out[i+1]=4;out[i+2]=16;out[i+3]=235;
            }
        }
    }
    _outlineOfcCtx.putImageData(new ImageData(out,_OFC_W,_OFC_H),0,0);
    _prev.imageSmoothingEnabled=false;
    if(sqX&&sqY&&(sqX!==1||sqY!==1)){
        var _fx=Math.floor(bx)+18,_fy=Math.floor(by)+47;
        _prev.save();
        _prev.translate(_fx,_fy);_prev.scale(sqX,sqY);_prev.translate(-_fx,-_fy);
        _prev.drawImage(_outlineOfc,bx-_OFC_BX,by-_OFC_BY);
        _prev.drawImage(_charOfc,bx-_OFC_BX,by-_OFC_BY);
        _prev.restore();
    }else{
        _prev.drawImage(_outlineOfc,bx-_OFC_BX,by-_OFC_BY);
        _prev.drawImage(_charOfc,bx-_OFC_BX,by-_OFC_BY);
    }
}
function txo(s,x,y,c,sz,al,alpha){
    const prev=utx.globalAlpha;
    if(alpha!==undefined)utx.globalAlpha=alpha;
    const ux=x*SC*uRatio,uy=y*SC*uRatio,usz=sz*SC*uRatio;
    utx.font=`bold ${usz}px -apple-system,'Hiragino Sans','Noto Sans JP',Arial,sans-serif`;
    utx.textAlign=al||'center';
    utx.fillStyle='rgba(0,0,0,.95)';
    for(const[ox,oy]of[[-2,0],[2,0],[0,-2],[0,2],[-1,-2],[1,-2],[-1,2],[1,2]])
        utx.fillText(s,ux+ox,uy+oy);
    utx.fillStyle=c;utx.fillText(s,ux,uy);
    utx.globalAlpha=prev;
}

// ロジックの共通化とオーバーアクション化（2〜3倍の強調）を両立する。
function getAnimState(){
    const t=gTick;
    const am=P.atk>0,amax=[12,16,22][P.atkCombo]||12,ap=am?Math.min(1,P.atk/amax):0;
    const mph=am?(ap>.6?'w':ap>.2?'s':'f'):'';
    const walk=P.onG&&Math.abs(P.vx)>.3&&!am;
    const idle=P.onG&&Math.abs(P.vx)<.3&&!am;
    return {
        t,am,ap,mph,walk,idle,
        breath:Math.sin(t*.06)*4,        // 待機の呼吸揺れ（スマホ実機QAで劇的強化指示）
        walkBob:Math.abs(Math.sin(t*.5))*5, // 歩行の上下バウンド（劇的強化）
        walkArm:Math.sin(t*.5)*7,        // 歩行の腕振り（劇的強化）
        lean:walk?P.dir*5:0,              // 歩行中の前傾オフセット（劇的強化）
        blink:(t%210)<5,
    };
}

function inp(cx,cy){
    if(gs==='splash'){splashTimer=200;return;}
    if(gs==='story'){
        if(cx===undefined||(cx>=W-44&&cy>=H-16)){skipStory();}
        return;
    }
    if(gs==='start'){
        if(cx!==undefined){
            const rowH=(SEL_GBOT-SEL_GTOP)/CHARS.length;
            if(cx>=SEL_LISTX&&cx<SEL_LISTX+SEL_LISTW&&cy>=SEL_GTOP&&cy<SEL_GBOT){
                const idx=Math.floor((cy-SEL_GTOP)/rowH);
                if(idx>=0&&idx<CHARS.length){
                    if(idx===selectedChar){if(!CHARS[idx].locked){startStory();}}
                    else{selectedChar=idx;}
                }
            }else if(cx>=SEL_FX&&cx<SEL_FX+SEL_FW&&cy>=SEL_GTOP&&cy<SEL_GBOT){
                if(!CHARS[selectedChar].locked){startStory();}
            }
        }else{
            if(!CHARS[selectedChar].locked){startStory();}
        }
        return;
    }
    if(gs==='stageclear'){if(clearTimer>60){if(stage>=2){if(score>best){best=score;localStorage.setItem('ldo_best',best);}gs='ending';clearTimer=0;}else{stage++;stageFlash=60;gs='playing';resetGame();}}return;}
    if(gs==='gameover'){location.reload();}
}

function drawBg(){
    // Sky
    const sg=ctx.createLinearGradient(0,0,0,GY);
    sg.addColorStop(0,'#3a80b8');sg.addColorStop(.6,'#70b0d8');sg.addColorStop(1,'#a8d0ec');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,GY);

    // Far mountains
    ctx.fillStyle='#6878a0';
    for(let i=0;i<6;i++){
        const mx=((i*110-scroll*.06+2000)%2000)-80;
        const mh=28+i%3*14;
        ctx.beginPath();ctx.moveTo(mx,GY-mh);ctx.lineTo(mx+44,GY);ctx.lineTo(mx-44,GY);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#7888b0';
    for(let i=0;i<4;i++){
        const mx=((i*160+60-scroll*.09+2000)%2000)-80;
        const mh=20+i%2*10;
        ctx.beginPath();ctx.moveTo(mx,GY-mh);ctx.lineTo(mx+32,GY);ctx.lineTo(mx-32,GY);ctx.closePath();ctx.fill();
    }

    // Clouds
    ctx.fillStyle='rgba(255,255,255,.82)';
    clouds.forEach(cl=>{
        const cx=(cl.sx-scroll*cl.spd+3000)%3000-100;
        ctx.beginPath();ctx.ellipse(cx+cl.w*.5,cl.y+cl.h*.5,cl.w*.5,cl.h*.5,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(cx+cl.w*.3,cl.y+cl.h*.2,cl.w*.3,cl.h*.7,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(cx+cl.w*.7,cl.y+cl.h*.25,cl.w*.28,cl.h*.65,0,0,Math.PI*2);ctx.fill();
    });

    // Midground trees
    ctx.fillStyle='#2a6020';
    for(let i=0;i<12;i++){
        const tx=((i*180+40-scroll*.35+3000)%3000)-30;
        const th=22+i%3*8;
        ctx.beginPath();ctx.moveTo(tx,GY-th);ctx.lineTo(tx+12,GY);ctx.lineTo(tx-12,GY);ctx.closePath();ctx.fill();
        ctx.fillStyle='#3a7828';
        ctx.beginPath();ctx.moveTo(tx,GY-th-6);ctx.lineTo(tx+9,GY-th+8);ctx.lineTo(tx-9,GY-th+8);ctx.closePath();ctx.fill();
        ctx.fillStyle='#2a6020';
    }

    // Ground layers
    ctx.fillStyle='#4a8c30';px(0,GY,W,5);
    ctx.fillStyle='#3a7820';px(0,GY+2,W,2);
    ctx.fillStyle='#7a5030';px(0,GY+5,W,H-GY-5);

    for(let i=0;i<8;i++){const tx=((i*44-scroll*.4+2000)%2000);px(tx,GY+10,22,1);px(tx+22,GY+18,14,1);}

    // Foreground grass tufts
    ctx.fillStyle='#5aa038';
    for(let i=0;i<16;i++){
        const gx=((i*82+10-scroll*.8+4000)%4000)-10;
        px(gx,GY-2,2,3);px(gx+4,GY-3,2,4);px(gx+8,GY-1,2,2);
    }
}

// ===== PIXEL ART SPRITE HELPER =====
function sprDraw(bx,by,rows,pal,flip,ps){
    ps=ps||1;
    const w=rows[0].length,h=rows.length;
    for(let r=0;r<h;r++){
        for(let c=0;c<w;c++){
            const col=pal[rows[r][flip?w-1-c:c]];
            if(col){ctx.fillStyle=col;ctx.fillRect(bx+c*ps,by+r*ps,ps,ps);}
        }
    }
}

// ===== 魔法使い =====
function drawMage(bx,by){

// ===== ドラゴン（クラシック翼竜・羽ばたきアニメ）=====
function drawDragon(bx,by){
    if(P.inv>0&&Math.floor(P.inv/4)%2===0)return;
    const cx=Math.floor(bx)+18,t=gTick,wk=Math.floor(t/7)%2;
    // 低重力での滞空調整：上昇中は羽ばたきを大きく、降下中は小さく畳んで滑空
    const _wgAmp=!P.onG?(P.vy<0?7:3):5;
    const wg=Math.sin(t*.13)*_wgAmp|0;
    // 尻尾は翼と位相をずらし、遅れてしなる
    const wt=Math.sin(t*.13-.9)*3|0;
    // 口元から常時漏れる炎の粒子・煙（実プレイ中のみ）
    if(gs==='playing'&&Math.random()<.04)spark(P.x+P.w/2-scroll+P.dir*20,P.y+10,Math.random()<.5?'#ff6600':'#5a5a5a',1);
    ctx.save();if(P.dir<0){ctx.translate(cx*2,0);ctx.scale(-1,1);}
    // 前傾姿勢（腰を軸に全身を少し前へ傾け、威圧感のある野性的な構えに）
    ctx.save();
    const _pvX=cx-2,_pvY=by+32;
    ctx.translate(_pvX,_pvY);ctx.rotate(.14);ctx.translate(-_pvX,-_pvY);
    // 尻尾
    ctx.fillStyle='#8a1c0e';px(cx-9,by+24+wt,5,5);px(cx-12,by+28+wt,4,5);px(cx-14,by+32+wt,3,4);
    ctx.fillStyle='#a81e10';px(cx-9,by+24+wt,3,4);px(cx-12,by+28+wt,3,4);
    ctx.fillStyle='#cc3020';px(cx-15,by+35+wt,2,3);px(cx-14,by+38+wt,3,2);
    // 翼（1.6倍に拡大した大翼・付け根を軸に拡大し羽ばたきアニメ）
    ctx.save();
    const _wpx=cx-3,_wpy=by+11;
    ctx.translate(_wpx,_wpy);ctx.scale(1.6,1.6);ctx.translate(-_wpx,-_wpy);
    ctx.fillStyle='#5e0800';
    ctx.beginPath();ctx.moveTo(cx-3,by+10);ctx.lineTo(cx-22,by-4+wg);ctx.lineTo(cx-17,by+18);ctx.lineTo(cx-5,by+22);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#200300';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#8e1200';
    ctx.beginPath();ctx.moveTo(cx-2,by+11);ctx.lineTo(cx-18,by-2+wg);ctx.lineTo(cx-13,by+16);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#3e0400';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx-3,by+11);ctx.lineTo(cx-22,by-4+wg);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-3,by+14);ctx.lineTo(cx-15,by+4+wg);ctx.stroke();
    ctx.restore();
    // 後ろ足（付け根を胴体下端(by+32)に固定=隙間ゼロ、歩行の上下動は足先の長さで表現）
    ctx.fillStyle='#8a1c0e';px(cx-8,by+32,7,9-wk);ctx.fillStyle='#5e0800';px(cx-8,by+32,3,9);
    ctx.fillStyle='#ece0a0';px(cx-10,by+40,2,3);px(cx-7,by+41,2,3);px(cx-4,by+40,2,3);
    // 体（角を落として丸みのあるシルエットに・幅を絞って引き締める）
    ctx.fillStyle='#aa1e10';px(cx-5,by+12,13,20);ctx.fillStyle='#7a1008';px(cx+6,by+12,3,20);
    ctx.clearRect(cx-5,by+12,2,2);ctx.clearRect(cx+6,by+12,2,2);
    ctx.fillStyle='#cc2810';px(cx-3,by+13,10,18);ctx.fillStyle='#e03828';px(cx-2,by+13,5,7);
    for(let si=0;si<4;si++)for(let sj=0;sj<2;sj++){ctx.fillStyle=(si+sj)%2===0?'#881408':'#a41c10';px(cx-2+sj*5,by+13+si*4,4,3);}
    // 黄金腹（ブレス放射中は熱で膨らみ発光する）
    const _breathing=P.atkCd>0,_bulge=_breathing?2:0;
    ctx.fillStyle='#d8b820';px(cx-1-_bulge*.5,by+16,5+_bulge,14);ctx.fillStyle='#f0d030';px(cx,by+16,3+_bulge,7);ctx.fillStyle='#b89818';px(cx+2,by+22,2,8);
    if(_breathing){ctx.globalAlpha=.4+Math.sin(gTick*.3)*.2;ctx.fillStyle='#ffee88';ctx.beginPath();ctx.arc(cx+1,by+22,7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}

    ctx.fillStyle='#8a1c0e';px(cx-11,by+16,5,11);ctx.fillStyle='#5e0800';px(cx-11,by+16,2,11);
    ctx.fillStyle='#ece0a0';px(cx-13,by+26,2,3);px(cx-10,by+27,2,3);px(cx-7,by+26,2,3);
    // 前腕（右・手前）：肘を張り爪を突き出す「ガオー」構え
    ctx.fillStyle='#aa1e10';px(cx+6,by+15,6,9);ctx.fillStyle='#7a1008';px(cx+10,by+15,2,9);
    ctx.fillStyle='#c02010';px(cx+9,by+11,7,8);ctx.fillStyle='#8a1408';px(cx+14,by+12,2,7);
    ctx.fillStyle='#ece0a0';ctx.strokeStyle='#4a3820';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx+13,by+12);ctx.lineTo(cx+20,by+7);ctx.lineTo(cx+15,by+15);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+14,by+15);ctx.lineTo(cx+22,by+11);ctx.lineTo(cx+16,by+18);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+14,by+18);ctx.lineTo(cx+21,by+17);ctx.lineTo(cx+15,by+21);ctx.closePath();ctx.fill();ctx.stroke();
    // 攻撃中（近接引っかき）：爪の振り抜きモーションラインを追加描画
    if(P.atk>0){
        const _cp=1-P.atk/14;
        ctx.globalAlpha=.55*(1-_cp);ctx.strokeStyle='#ffccaa';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx+13,by+12);ctx.lineTo(cx+13+10*_cp,by+8-4*_cp);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+14,by+18);ctx.lineTo(cx+14+12*_cp,by+22-2*_cp);ctx.stroke();

    // 首

    ctx.fillStyle='#8a1408';px(cx-1,by+0,16,12);ctx.fillStyle='#5e0800';px(cx+11,by+0,5,12);

    ctx.clearRect(cx-1,by,2,2);ctx.clearRect(cx-1,by+10,2,2);ctx.clearRect(cx+13,by,2,1);

    ctx.fillStyle='#cc1000';px(cx+1,by+11,11,1);
    // 眉間の鋭い隆起（角より先に描き、角の根本を欠けさせない）
    ctx.fillStyle='#5e0800';px(cx-1,by,7,2);
    // 角（金色）
    ctx.fillStyle='#c8a820';px(cx,by-5,3,7);ctx.fillStyle='#e8c030';px(cx+1,by-5,2,5);

// ===== ゴブリン（醜い小男）=====

    const _tw=(anim.idle&&(gTick%150)<4)?1:0;

    const _lean=_fast?P.dir*2:0;

    if(gs==='playing'&&_fast&&P.onG&&Math.random()<.5)spark(P.x+P.w/2-scroll-P.dir*6,GY-2,'#c8b898',1);

    ctx.fillStyle='#202020';px(cx+5,by+15,9,11);ctx.fillStyle='#181818';px(cx+11,by+16,3,11);
    ctx.fillStyle='#505050';px(cx-10,by+16,3,5);px(cx+8,by+16,3,5);
    ctx.fillStyle='#aaaaaa';px(cx-10,by+14,2,3);px(cx-8,by+13,2,2);px(cx+9,by+14,2,3);px(cx+11,by+13,2,2);

// ===== スライム（丸くてかわいい）=====
function drawSlime(bx,by){
    if(P.inv>0&&Math.floor(P.inv/4)%2===0)return;
    const cx=Math.floor(bx)+18,t=gTick,bob=Math.abs(Math.sin(t*.09))*4|0;
    const anim=getAnimState();
    const _am=anim.am,_ap=anim.ap,_mph=anim.mph;
    // 二段ジャンプ上昇中は「ぐにょーん」と縦に伸びる
    const _djStretch=(!P.onG&&P.dj&&P.vy<-2)?.14:0;
    // 移動中は進行方向にイージングで伸び縮みするプロポーション変化を追加
    const _moveStretch=(P.onG&&Math.abs(P.vx)>.3)?Math.sin(t*.35)*.09:0;
    const _wob=Math.sin(t*.18)*.04+_djStretch+_moveStretch;
    ctx.save();if(P.dir<0){ctx.translate(cx*2,0);ctx.scale(-1,1);}
    // 常時プルプルとしたゼリーの揺れ（本体中心を軸に伸縮）
    ctx.save();ctx.translate(cx,by+26);ctx.scale(1-_wob,1+_wob);ctx.translate(-cx,-(by+26));
    // 影
    ctx.globalAlpha=.15;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(cx,by+47,12,3,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    // 擬似足
    ctx.fillStyle='#1e88dd';
    px(cx-7,by+36+bob,4,10-bob);px(cx+3,by+36+bob,4,10-bob);
    // 擬似腕（左）
    ctx.fillStyle='#1e88dd';px(cx-11,by+25+bob,4,8);px(cx-12,by+27+bob,3,6);
    // 擬似腕（右・攻撃フェーズ：体ごと伸びて叩く）
    if(_mph==='w'){
        ctx.fillStyle='#2299ee';px(cx+5,by+24+bob,5,7);px(cx+7,by+26+bob,3,5);
        ctx.fillStyle='#1a88dd';px(cx+9,by+24+bob,1,6);
    }else if(_mph==='s'){
        ctx.fillStyle='#2299ee';px(cx+9,by+21+bob,8,9);px(cx+15,by+22+bob,5,8);px(cx+19,by+23+bob,3,7);
        ctx.fillStyle='#1a88dd';px(cx+21,by+21+bob,1,9);
        ctx.globalAlpha=.4;ctx.fillStyle='#66ddff';ctx.beginPath();ctx.arc(cx+23,by+26+bob,5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        if(gs==='playing'&&Math.random()<.5)spark(P.x+P.w/2-scroll+P.dir*23,P.y+16,'#66ddff',1);
    }else if(_mph==='f'){
        ctx.fillStyle='#2299ee';px(cx+8,by+22+bob,6,8);px(cx+12,by+24+bob,4,6);
        ctx.fillStyle='#1a88dd';px(cx+14,by+22+bob,1,7);
        // 発射後、本体表面に波紋が広がって収まる
        const _rip=(_ap*5)%1;

function drawDroid(en){

    if(en.inv>0&&Math.floor(en.inv/4)%2===0)return;
    const cx=x+9,gy=y+30,ph=Math.floor(en.fr/9)%2,fl=en.dir<0;

    ctx.fillStyle='#1a2030';

    ctx.fillStyle='#0088ff';ctx.fillRect(cx-5,gy-4,3,3);ctx.fillRect(cx+3,gy-4,3,3);

    ctx.fillStyle='#44aaff';ctx.beginPath();ctx.arc(cx,y+20,2.5,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#243348';ctx.fillRect(cx+2,y+2,6,4);
    // バイザー（サイクロプスアイ）
    ctx.fillStyle='#001122';ctx.fillRect(cx-7,y+3,14,7);

    ctx.fillStyle='#88ccff';ctx.fillRect(cx-4,y+5,5,2);// ハイライト

function drawBoss(b){
    const x=Math.floor(b.sx-scroll),y=Math.floor(b.sy);
    if(x<-40||x>W+40)return;
    if(b.inv>0&&Math.floor(b.inv/4)%2===0)return;
    const cx=x+14,gy=y+55,ph=Math.floor(b.fr/8)%2,fl=b.dir<0;
    ctx.save();if(fl){ctx.translate(cx*2,0);ctx.scale(-1,1);}
    // 触手脚
    ctx.fillStyle='#1a0838';
    ctx.fillRect(cx-13,gy-(ph?20:14),9,ph?20:14);ctx.fillRect(cx+4,gy-(ph?14:20),9,ph?14:20);
    // 吸盤
    ctx.fillStyle='#3c0a70';
    [cx-14,cx-10,cx-6].forEach(px=>{ctx.beginPath();ctx.arc(px,gy-2,2.2,0,Math.PI*2);ctx.fill();});
    [cx+6,cx+9,cx+13].forEach(px=>{ctx.beginPath();ctx.arc(px,gy-2,2.2,0,Math.PI*2);ctx.fill();});
    // 胴体（巨大）
    ctx.fillStyle='#0a0220';ctx.fillRect(cx-17,y+16,34,34);
    ctx.fillStyle='#180438';ctx.fillRect(cx-16,y+17,32,32);
    // 装甲パネル（エイリアン）
    ctx.fillStyle='#340870';ctx.fillRect(cx-15,y+17,13,11);ctx.fillRect(cx+2,y+17,13,11);
    ctx.fillStyle='#480a90';ctx.fillRect(cx-14,y+18,11,9);ctx.fillRect(cx+3,y+18,11,9);
    // 胸のコア（巨大発光）
    const pulse=Math.sin(b.fr*.1)*.5+.5;
    ctx.globalAlpha=.8+pulse*.2;
    ctx.fillStyle='#bb00ff';ctx.beginPath();ctx.arc(cx,y+31,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff44ff';ctx.beginPath();ctx.arc(cx,y+31,4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx-1,y+29,2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.2+pulse*.15;ctx.fillStyle='#ff00ff';ctx.beginPath();ctx.arc(cx,y+31,16,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // レイジオーラ（HP50%以下）
    if(b.rage){
        const rp=0.28+Math.sin(b.fr*.35)*.28;
        ctx.globalAlpha=rp;ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='#cc2200';ctx.beginPath();ctx.arc(cx,y+7,28,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(cx,y+7,16,0,Math.PI*2);ctx.fill();
        ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }
    // 触手腕（左）
    ctx.strokeStyle='#1e0838';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(cx-16,y+22);ctx.bezierCurveTo(cx-30,y+28,cx-32,y+38,cx-24,y+46);ctx.stroke();
    ctx.strokeStyle='#3a0a60';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(cx-16,y+22);ctx.bezierCurveTo(cx-29,y+28,cx-31,y+38,cx-23,y+46);ctx.stroke();
    // 右腕（エネルギーキャノン）
    ctx.fillStyle='#1e0838';ctx.fillRect(cx+16,y+20,8,20);
    ctx.fillStyle='#0044aa';ctx.fillRect(cx+22,y+28,12,6);
    ctx.globalAlpha=.8+pulse*.2;ctx.fillStyle='#00aaff';ctx.fillRect(cx+33,y+29,4,4);ctx.globalAlpha=1;
    // 爪（左触手先端）
    ctx.fillStyle='#6600cc';
    [[cx-24,y+46],[cx-28,y+44],[cx-20,y+50]].forEach(([cx2,cy2])=>{
        ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2-3,cy2+8);ctx.lineTo(cx2+3,cy2+7);ctx.closePath();ctx.fill();
    });
    // 頭（巨大球体）
    ctx.fillStyle='#060112';ctx.beginPath();ctx.arc(cx,y+7,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#12022a';ctx.beginPath();ctx.arc(cx,y+7,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#200840';ctx.beginPath();ctx.arc(cx-2,y+5,16,0,Math.PI*2);ctx.fill();
    // 頭のスパイク
    ctx.fillStyle='#5500bb';
    [[cx-9,y-13,cx-12,y-4],[cx-3,y-15,cx-4,y-5],[cx+3,y-15,cx+4,y-5],[cx+9,y-13,cx+12,y-4]].forEach(([tx,ty,bx2,by2])=>{
        ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx2-3,by2);ctx.lineTo(bx2+3,by2);ctx.closePath();ctx.fill();
    });
    ctx.fillStyle='#8822ff';ctx.beginPath();ctx.arc(cx,y-15,2.5,0,Math.PI*2);ctx.fill();
    // 目（4つ）
    [[cx-8,y+3,'#ff0000'],[cx-2,y+1,'#ff8800'],[cx+3,y+1,'#ffcc00'],[cx+9,y+3,'#ff0000']].forEach(([ex,ey,ec])=>{
        ctx.fillStyle='#111111';ctx.beginPath();ctx.arc(ex,ey,3.8,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=ec;ctx.beginPath();ctx.arc(ex,ey,2.8,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=.45+pulse*.45;ctx.fillStyle=ec;ctx.beginPath();ctx.arc(ex,ey,5.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ex-.6,ey-.8,1,0,Math.PI*2);ctx.fill();
    });
    // 口（鋭い歯）
    ctx.fillStyle='#080112';ctx.fillRect(cx-9,y+12,18,5);
    ctx.fillStyle='#cc44ff';
    for(let i=0;i<5;i++){ctx.fillRect(cx-9+i*3+1,y+12,2,3);}
    // HPバー
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(cx-24,y-24,48,6);
    const hp=b.hp/b.maxHp;
    const hcol=hp>.5?'#cc00ff':hp>.25?'#ff4400':'#ff0000';
    ctx.fillStyle=hcol;ctx.fillRect(cx-24,y-24,48*hp,6);
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(cx-24,y-24,Math.min(12,48*hp),2);
    txo('WARLORD',cx,y-22,'#ff44ff',4.5);
    ctx.restore();
}
// ステージ2ボス：機械系ドローン司令塔（タコ型のWARLORDとは真逆の無機質な空中砲台）
function drawBossMech(b){
    const x=Math.floor(b.sx-scroll),y=Math.floor(b.sy);
    if(x<-40||x>W+40)return;
    if(b.inv>0&&Math.floor(b.inv/4)%2===0)return;
    const cx=x+15,cy2=y+15,fl=b.dir<0;
    ctx.save();if(fl){ctx.translate(cx*2,0);ctx.scale(-1,1);}
    // 推進スラスター（下部・ホバー時の噴射）
    ctx.globalAlpha=.5+Math.sin(b.fr*.3)*.2;ctx.fillStyle='#44aaff';
    ctx.beginPath();ctx.ellipse(cx-8,y+32,3,6,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+8,y+32,3,6,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // レイジオーラ（HP50%以下）
    if(b.rage){
        const rp=.28+Math.sin(b.fr*.35)*.28;
        ctx.globalAlpha=rp;ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='#ff2200';ctx.beginPath();ctx.arc(cx,cy2,26,0,Math.PI*2);ctx.fill();
        ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }
    // 円盤状の本体（無機質メタリック）
    ctx.fillStyle='#3a4048';ctx.beginPath();ctx.ellipse(cx,cy2,26,13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#565e68';ctx.beginPath();ctx.ellipse(cx,cy2-2,23,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#20242a';ctx.beginPath();ctx.ellipse(cx,cy2+6,24,6,0,0,Math.PI*2);ctx.fill();
    // パネルライン
    ctx.strokeStyle='#1a1e22';ctx.lineWidth=1;
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(cx+i*9,cy2-9);ctx.lineTo(cx+i*9,cy2+3);ctx.stroke();}
    // ドーム状の頭部
    ctx.fillStyle='#4a525c';ctx.beginPath();ctx.arc(cx,y+2,13,Math.PI,0);ctx.fill();
    ctx.fillStyle='#666e78';ctx.beginPath();ctx.arc(cx,y+2,10,Math.PI,0);ctx.fill();
    // アンテナ
    ctx.strokeStyle='#787e88';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,y-11);ctx.lineTo(cx,y-19);ctx.stroke();
    ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(cx,y-20,1.8,0,Math.PI*2);ctx.fill();
    // 中央の赤い単眼センサー（スキャンするように左右に動く）
    const _scan=Math.sin(b.fr*.06)*6;
    ctx.fillStyle='#1a0000';ctx.beginPath();ctx.arc(cx,y+2,7,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.85+Math.sin(b.fr*.2)*.15;
    ctx.fillStyle='#ff2020';ctx.beginPath();ctx.arc(cx+_scan*.5,y+2,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffaaaa';ctx.beginPath();ctx.arc(cx+_scan*.5-1,y+1,1.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // サイドの兵装ポッド
    ctx.fillStyle='#2a2e34';ctx.fillRect(cx-32,cy2-4,8,8);ctx.fillRect(cx+24,cy2-4,8,8);
    ctx.fillStyle='#3a4048';ctx.fillRect(cx-31,cy2-3,6,3);ctx.fillRect(cx+25,cy2-3,6,3);
    // レーザー予兆（telegraph）：徐々に伸びる細い警告線
    if(b.phase==='telegraph'){
        const lw2=Math.min(1,(b.laserT||0)/40);
        ctx.globalAlpha=.5*lw2;ctx.strokeStyle='#ff4444';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(cx-200,cy2);ctx.lineTo(cx+200,cy2);ctx.stroke();ctx.globalAlpha=1;
    }
    // レーザー本体（laser発動中）
    if(b.phase==='laser'){
        ctx.globalAlpha=.85;ctx.fillStyle='#ff6666';ctx.fillRect(cx-300,cy2-3,600,6);
        ctx.globalAlpha=.5;ctx.fillStyle='#ffffff';ctx.fillRect(cx-300,cy2-1,600,2);
        ctx.globalAlpha=1;
    }
    // HPバー
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(cx-24,y-30,48,6);
    const hp2=b.hp/b.maxHp;
    const hcol2=hp2>.5?'#66ccff':hp2>.25?'#ff8844':'#ff2222';
    ctx.fillStyle=hcol2;ctx.fillRect(cx-24,y-30,48*hp2,6);
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(cx-24,y-30,Math.min(12,48*hp2),2);
    txo('SENTINEL',cx,y-28,'#88ccff',4.5);
    ctx.restore();
}
